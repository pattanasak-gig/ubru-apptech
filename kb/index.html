<script>
// =====================================================================
// หน้าความรู้ (สาธารณะ · DEC-124/125) — หน้าละหนึ่งเรื่อง ลิงก์มาจากปุ่ม ? และแถบลิงก์ใต้ตัวเลข
//   #method วิธีคำนวณ · #factors ค่าอ้างอิงและแหล่งที่มา · #sensitivity เทียบวิธีคำนวณ · #trees ต้นไม้เทียบเท่า · #scope ขอบเขตและข้อจำกัด
//   ภาษาทางการ · อ้างอิงในเนื้อหาแบบ (ผู้แต่ง, ปี) และรายการเอกสารอ้างอิงท้ายหน้าแบบ APA 7
//   ค่าตัวเลขอ่านสดจาก food.v_public_carbon_factor และ food.v_public_carbon (ไม่ฝังตัวเลขในหน้า)
// =====================================================================
let KB = null;
window.addEventListener('hashchange', render);
async function load() {
  if (KB) return KB;
  const [factors, rows] = await Promise.all([api.list('food.v_public_carbon_factor', { order: ['sort_order'] }), api.list('food.v_public_carbon', {}).catch(() => [])]);
  const T = { kg: 0, t_fixed: 0, t_km_ef_assumed: 0 }; for (const r of rows) for (const k of Object.keys(T)) T[k] += +r[k] || 0;
  return KB = { factors, fx: ctFactors(factors), T };
}
// เอกสารอ้างอิง (APA 7) — ตรวจกับต้นฉบับแล้วโดยแชทคาร์บอน (CARBON-TREE-R01 ข้อ 7) และการเปิดหน้าเว็บต้นทาง 1 พ.ย. 2569
const REFS = {
  tgoLess: 'องค์การบริหารจัดการก๊าซเรือนกระจก (องค์การมหาชน). (2567). <i>LESS-WM-07 การนำขยะอินทรีย์ประเภทเศษอาหารไปใช้เป็นอาหารสัตว์</i> (version 05). https://ghgreduction.tgo.or.th/th/calculation/less-calculate-document/less-waste/item/2100-2021-05-20-06-54-06.html',
  tgoCfp: 'องค์การบริหารจัดการก๊าซเรือนกระจก (องค์การมหาชน). (2565). <i>ค่าการปล่อยก๊าซเรือนกระจก (Emission Factor) แบ่งตามประเภทกลุ่มอุตสาหกรรม (CFP)</i> (UPDATE กรกฎาคม 2565).',
  tgoCfo: 'องค์การบริหารจัดการก๊าซเรือนกระจก (องค์การมหาชน). (2569). <i>ค่าการปล่อยก๊าซเรือนกระจกสำหรับการประเมินคาร์บอนฟุตพริ้นท์ขององค์กร</i> (UPDATE กุมภาพันธ์ 2569).',
  mertenat: 'Mertenat, A., Diener, S., & Zurbrügg, C. (2019). Black Soldier Fly biowaste treatment – Assessment of global warming potential. <i>Waste Management, 84</i>, 173–181. https://doi.org/10.1016/j.wasman.2018.11.040',
  mnre: 'ศูนย์องค์ความรู้ด้านทรัพยากรธรรมชาติและสิ่งแวดล้อม กระทรวงทรัพยากรธรรมชาติและสิ่งแวดล้อม. (2567, 26 เมษายน). <i>รู้หรือไม่!? ต้นไม้ 1 ต้น สามารถดูดซับก๊าซคาร์บอนไดออกไซด์ ฝุ่น และมลพิษในอากาศได้</i>. https://hub.mnre.go.th/th/knowledge/detail/65793',
  patumwan: 'ปทุมวัน. (2568). <i>รายงานวิจัยฉบับสมบูรณ์</i> [รายงานวิจัยของโครงการ].',
  iso14044: 'International Organization for Standardization. (2006). <i>ISO 14044:2006 Environmental management — Life cycle assessment — Requirements and guidelines</i>. ISO.',
  iso14083: 'International Organization for Standardization. (2023). <i>ISO 14083:2023 Greenhouse gases — Quantification and reporting of greenhouse gas emissions arising from transport chain operations</i>. ISO.',
  ghgp: 'World Resources Institute & World Business Council for Sustainable Development. (2004). <i>The Greenhouse Gas Protocol: A corporate accounting and reporting standard</i> (Revised ed.). WRI/WBCSD.'
};
const refList = keys => `<h3>เอกสารอ้างอิง</h3><div class="refs"><ol>${keys.map(k => `<li>${REFS[k]}</li>`).join('')}</ol></div>`;
const cite = f => f ? `<tr><td>${esc(f.name)}<div class="muted">${esc(f.code)}</div></td><td class="num nowrap">${fmtEf(f.value)}<div class="muted">${esc(f.unit)}</div></td><td>${esc(f.source || '')}${f.source_detail ? `<div class="muted">${esc(f.source_detail)}</div>` : ''}${f.note ? `<div class="muted">หมายเหตุ: ${esc(f.note)}</div>` : ''}${f.source_url ? `<div><a href="${esc(f.source_url)}" target="_blank" rel="noopener">เปิดแหล่งอ้างอิง</a></div>` : ''}</td></tr>` : '';
const v = (f, d = '-') => f ? fmtEf(f.value) : d;
const PAGES = {
  method: ({ fx }) => `<h2>วิธีคำนวณ</h2>
    <p>ระบบประเมินปริมาณก๊าซเรือนกระจกที่หลีกเลี่ยงได้จากการนำเศษอาหารไปใช้เลี้ยงหนอน BSF แทนการนำไปฝังกลบ โดยคำนวณเป็น 3 ระดับ ดังนี้</p>
    <div class="eq">A = ปริมาณเศษอาหาร (กก.) × ค่าการปล่อยจากการฝังกลบ<br>B = A − การปล่อยจากการขนส่ง<br>C = B − การปล่อยจากกระบวนการเลี้ยงหนอน (กก. × ${v(fx.pr)})</div>
    <p>ระบบใช้ค่า C เป็นตัวเลขหลักในการสื่อสาร เนื่องจากหักการปล่อยที่เกี่ยวข้องครบทุกส่วนแล้ว จึงไม่แสดงผลเกินจริง</p>
    <h3>ค่าการปล่อยจากการฝังกลบ</h3>
    <p>ระบบคำนวณคู่กันเสมอ 2 ค่า ได้แก่ ${v(fx.lfMain)} kgCO2e/กก. ซึ่งเป็นค่าตามวิธีการคำนวณสำหรับกิจกรรมการนำเศษอาหารไปใช้เป็นอาหารสัตว์ (องค์การบริหารจัดการก๊าซเรือนกระจก [อบก.], 2567) และ ${v(fx.lfAlt)} kgCO2e/กก. ซึ่งเป็นค่าของการฝังกลบขยะมูลฝอยชุมชนแบบถูกหลักสุขาภิบาล (อบก., 2565) โดยค่าหลังใช้เป็นขอบบนของช่วงเท่านั้น รายละเอียดดูที่ <a href="#factors">ค่าอ้างอิงและแหล่งที่มา</a></p>
    <h3>การปล่อยจากการขนส่ง</h3>
    <p>ระบบคำนวณเป็นรายเที่ยวรถ จากปริมาณน้ำมันเชื้อเพลิง (ลิตร) คูณค่าการปล่อยของน้ำมันชนิดนั้น (อบก., 2569) โดยปริมาณน้ำมันได้จากลิตรที่เติมจริง หรือระยะทางหารด้วยอัตราสิ้นเปลืองของรถ หากรถคันใดยังไม่ระบุอัตราสิ้นเปลือง ระบบใช้ค่าสมมติ ${v(fx.fe)} กม./ลิตร</p>
    <p>ระยะทางพิจารณาตามลำดับดังนี้ ลิตรที่เติมจริง ระยะทางที่บันทึกในรอบ เส้นทางที่เลือกในรอบ เส้นทางหลักของฟาร์ม และเส้นทางเดียวของฟาร์ม ทั้งนี้ สองกรณีหลังถือเป็นค่าประมาณ</p>
    <h3>การปันส่วนการปล่อยจากการขนส่งให้แต่ละแหล่งกำเนิด</h3>
    <div class="eq">การปล่อยจากการขนส่งของแหล่ง = การปล่อยของเที่ยว × น้ำหนักเศษอาหารของแหล่ง ÷ น้ำหนักเศษอาหารทั้งเที่ยว</div>
    <p>การปันส่วนตามน้ำหนักเป็นการปันส่วนตามความสัมพันธ์ทางกายภาพ ซึ่งเป็นลำดับขั้นหนึ่งของขั้นตอนการปันส่วนตาม ISO 14044:2006 ข้อ 4.3.4.2 (International Organization for Standardization [ISO], 2006) อย่างไรก็ดี ISO 14083:2023 แนะนำให้ปันส่วนตามกิจกรรมการขนส่ง (น้ำหนัก × ระยะทาง) (ISO, 2023) ซึ่งระบบจะนำมาใช้ได้เมื่อมีการบันทึกลำดับจุดรับเศษอาหารรายเที่ยว</p>
    <h3>การเทียบกับการดูดซับของต้นไม้</h3>
    <div class="eq">จำนวนต้นไม้ (ต้น) = C ÷ ${v(fx.treeMain)} กก./ต้น/ปี<br>ระยะเวลาของต้นไม้ 1 ต้น (เดือน) = C ÷ (${v(fx.treeMain)} ÷ 12)</div>
    <p>ความหมายและที่มาของค่า ดูที่ <a href="#trees">ต้นไม้เทียบเท่าคืออะไร</a></p>
    <h3>การปัดเลข</h3>
    <ul><li>ตัวเลขที่แสดงต่อสาธารณะปัดลงทุกค่า ส่วนฐานข้อมูลเก็บค่าจริงไว้</li><li>kgCO2e แสดงทศนิยม 2 ตำแหน่ง และตั้งแต่ 1,000 kgCO2e ขึ้นไปแสดงเป็นตันคาร์บอนไดออกไซด์เทียบเท่า</li><li>จำนวนต้นไม้ที่ต่ำกว่า 10 ต้นแสดงทศนิยม 1 ตำแหน่ง ช่วง 10–999 ต้นแสดงเป็นจำนวนเต็ม และตั้งแต่ 1,000 ต้นขึ้นไปปัดลงเป็นหลักร้อย</li><li>ระยะเวลาปัดลงเป็นเดือน และตั้งแต่ 12 เดือนขึ้นไปแสดงเป็นปีและเดือน</li></ul>
    <h3>กรณีค่าติดลบ</h3><p>หากการปล่อยจากการขนส่งเท่ากับหรือมากกว่าปริมาณที่หลีกเลี่ยงได้ ระบบเก็บค่าจริงไว้ แต่แสดงผลเป็น 0 พร้อมข้อความกำกับ และไม่แปลงค่าดังกล่าวเป็นจำนวนต้นไม้</p>
    ${refList(['iso14044', 'iso14083', 'tgoLess', 'tgoCfp', 'tgoCfo'])}`,
  factors: ({ fx }) => { const fuel = (fx.fuel || []).find(f => /b7/i.test(f.fuel_code || '') && !/premium/i.test(f.fuel_code || '')); return `<h2>ค่าอ้างอิงและแหล่งที่มา</h2>
    <p>ตารางต่อไปนี้แสดงค่าสัมประสิทธิ์ทุกค่าที่ใช้ในตัวเลขหลัก พร้อมแหล่งอ้างอิง ฉบับ และหน้าหรือลำดับในเอกสารต้นฉบับ</p>
    <div class="tscroll"><table><thead><tr><th>รายการ</th><th class="num">ค่า</th><th>แหล่งอ้างอิง</th></tr></thead><tbody>${[fx.lfMain, fx.lfAlt, fuel, fx.pr, fx.treeMain, fx.treeAlt].map(cite).join('')}</tbody></table></div>
    <p class="muted">${CT_STAR}</p><p class="muted">ค่าอื่นที่ระบบเก็บไว้เพื่อการเปรียบเทียบ ดูที่ <a href="#sensitivity">เทียบวิธีคำนวณ</a></p>
    ${refList(['tgoLess', 'tgoCfp', 'tgoCfo', 'mertenat', 'mnre', 'patumwan'])}`; },
  sensitivity: ({ factors, T }) => `<h2>เทียบวิธีคำนวณ</h2>
    <p>ตารางนี้แสดงการเปลี่ยนแปลงของผลการคำนวณเมื่อใช้ค่าการปล่อยจากการฝังกลบค่าอื่น (แถว) หรืออัตราสิ้นเปลืองค่าอื่นสำหรับรถที่ยังไม่ระบุอัตราสิ้นเปลือง (คอลัมน์) โดยใช้ยอดรวมของทุกโครงการที่เผยแพร่ หน่วยเป็น kgCO2e และปัดลง</p>
    ${ctSensitivity(T, factors)}
    <p class="muted">ค่าการปล่อยจากการฝังกลบบางค่าในตารางรวมการขนส่งของกรณีศึกษาต้นทางไว้แล้ว จึงใช้เพื่อการเปรียบเทียบเท่านั้น ไม่ใช้ในตัวเลขหลัก</p>`,
  trees: ({ fx }) => { const k = fx.treeMain ? +fx.treeMain.value : 15, kA = fx.treeAlt ? +fx.treeAlt.value : 12, lf = fx.lfMain ? +fx.lfMain.value : 0.571; return `<h2>ต้นไม้เทียบเท่าคืออะไร</h2>
    <p>"ต้นไม้ N ต้น" หมายถึง ปริมาณก๊าซเรือนกระจกที่หลีกเลี่ยงได้มีค่าเท่ากับปริมาณก๊าซคาร์บอนไดออกไซด์ที่ต้นไม้ N ต้นดูดซับรวมกันในระยะเวลา 1 ปี การเทียบนี้มีวัตถุประสงค์เพื่อการสื่อสาร มิได้หมายถึงการปลูกต้นไม้หรือการมีต้นไม้อยู่จริง</p>
    <p>ในกรณีที่ผลลัพธ์น้อยกว่า 1 ต้น ระบบแสดงผลเป็นระยะเวลาที่ต้นไม้ 1 ต้นใช้ดูดซับแทน เช่น "ต้นไม้ 1 ต้นดูดซับ 4 เดือน"</p>
    <h3>ค่าที่ใช้</h3>
    <p>ต้นไม้ 1 ต้นดูดซับก๊าซคาร์บอนไดออกไซด์ได้เฉลี่ย 9–15 กิโลกรัมต่อปี (ศูนย์องค์ความรู้ด้านทรัพยากรธรรมชาติและสิ่งแวดล้อม, 2567) ระบบใช้ค่า ${k} กก./ต้น/ปี เป็นค่าหลัก เนื่องจากเป็นค่าสูงสุดของช่วง จึงให้จำนวนต้นไม้น้อยที่สุดและไม่แสดงผลเกินจริง และใช้ค่า ${kA} กก./ต้น/ปี เป็นค่าเปรียบเทียบตามรายงานวิจัยฉบับสมบูรณ์ของโครงการ (ปทุมวัน, 2568, หน้า 188)</p>
    <p>ระบบไม่ใช้ค่า 9 กก./ต้น/ปี เนื่องจากให้จำนวนต้นไม้มากที่สุด และไม่ใช้ค่าของสำนักงานปกป้องสิ่งแวดล้อมแห่งสหรัฐอเมริกา (60 กก./ต้น/ปี) เนื่องจากเป็นค่าของต้นไม้ในเขตเมืองของสหรัฐอเมริกา ซึ่งมีบริบทแตกต่างจากประเทศไทย</p>
    <h3>ตัวอย่างการคำนวณ</h3>
    <ul><li>เศษอาหาร 10 กก. × ${fmtEf(lf)} = ${ctCO2Text(10 * lf)} ${ctTreePhrase(10 * lf, k)}</li><li>เศษอาหาร 120 กก. × ${fmtEf(lf)} = ${ctCO2Text(120 * lf)} ${ctTreePhrase(120 * lf, k)}</li></ul>
    <p class="muted">อัตราการดูดซับของต้นไม้แตกต่างกันตามชนิด อายุ และสภาพการปลูก ตัวเลขนี้เป็นการเทียบเพื่อการสื่อสารในหน่วยคาร์บอนไดออกไซด์เทียบเท่า</p>
    ${refList(['mnre', 'patumwan'])}`; },
  scope: () => `<h2>ขอบเขตและข้อจำกัด</h2>
    <h3>ขอบเขตที่นับรวม</h3>
    <ul><li>การขนส่ง ตั้งแต่จุดเริ่มต้นของเส้นทาง แหล่งกำเนิดเศษอาหาร จนถึงฟาร์ม (รวมขากลับเมื่อเส้นทางกำหนดเป็นไป–กลับ) โดยนับเต็มเส้นทางทุกเที่ยว</li><li>การฝังกลบที่หลีกเลี่ยงได้ เมื่อเศษอาหารถูกนำไปเลี้ยงหนอน BSF แทนการนำไปฝังกลบรวมกับขยะอื่น</li><li>การปล่อยจากกระบวนการเลี้ยงหนอน โดยใช้ค่าจากงานวิจัยในต่างประเทศ (Mertenat et al., 2019) เนื่องจากยังไม่มีค่าที่ศึกษาในประเทศไทย</li></ul>
    <h3>ขอบเขตที่ไม่นับรวม</h3><ul><li>การแปรรูปผลผลิต การใช้ไฟฟ้าในฟาร์ม และประโยชน์จากการใช้หนอนทดแทนอาหารสัตว์หรือปุ๋ย</li></ul>
    <h3>ข้อจำกัดในการนำตัวเลขไปใช้</h3>
    <ul><li>ตัวเลขเป็นค่าประมาณเพื่อการสื่อสาร มิใช่การรับรองหรือคาร์บอนเครดิต เนื่องจากมิได้ขึ้นทะเบียนเป็นโครงการลดก๊าซเรือนกระจก (T-VER) และมิได้ผ่านการตรวจสอบความใช้ได้และการทวนสอบ</li><li>${CT_SRC_NOTE} ทั้งนี้ ตามหลักการรายงานการลดก๊าซเรือนกระจกแยกจากบัญชีก๊าซเรือนกระจกขององค์กร (World Resources Institute & World Business Council for Sustainable Development, 2004, บทที่ 8)</li><li>แหล่งกำเนิดเศษอาหาร ศูนย์การเรียนรู้ และเทศบาล สามารถอ้างได้ว่ามีส่วนร่วม แต่ห้ามนำตัวเลขของแต่ละฝ่ายมารวมกัน เนื่องจากภาพรวมของศูนย์คือผลรวมของทุกแหล่งอยู่แล้ว</li></ul>
    <p class="muted">${CT_STAR}</p>
    ${refList(['ghgp', 'mertenat'])}`
};
async function render() {
  const key = PAGES[(location.hash || '#method').slice(1)] ? (location.hash || '#method').slice(1) : 'method', view = $('#view');
  $('#kbnav').innerHTML = CT_KB.map(([h, l]) => `<a href="#${h}" class="${h === key ? 'active' : ''}" ${h === key ? 'aria-current="page"' : ''}>${l}</a>`).join('');
  try { const d = await load(); view.innerHTML = `<div class="card">${PAGES[key](d)}</div><div class="muted" style="margin:8px 0 16px"><a href="../">‹ กลับหน้าหลัก</a></div>`; document.title = 'ความรู้: ' + (CT_KB.find(x => x[0] === key) || [0, ''])[1]; scrollTo(0, 0); }
  catch (e) { const f = friendlyError(e, 'โหลดข้อมูลไม่สำเร็จ'); view.innerHTML = `<div class="card"><b style="color:var(--danger)">${esc(f.title)}</b><div>${esc(f.hint || '')}</div></div>`; }
}
$('#credit').textContent = CREDIT.short; render();
</script>
