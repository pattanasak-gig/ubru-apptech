<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>บันทึกการเข้ารับเศษอาหาร</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="../common.css?v=20261031a">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../common.js?v=20261031a"></script>
<script src="../hh-check.js?v=20261031a"></script>
<script src="../hh.js?v=20261031a"></script>
</head>
<body>
<header>
  <h1 id="title"><a href="../">UBRU AppTech</a> › บันทึกการเข้ารับเศษอาหาร</h1>
  <span id="who" class="muted" style="color:#dbeafe;font-size:13px"></span>
  <button id="btnQueue" class="hidden" onclick="go('#queue')">รอส่ง <b id="queueCount">0</b></button>
  <button onclick="go('#me')">บัญชี</button>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="view"></main>
<footer class="credit" id="credit"></footer>
<div id="toastHost" role="status" aria-live="polite"></div>

<script>
// =====================================================================
// โมดูล: บันทึกการเข้ารับเศษอาหาร (food) — DEC-106
//   ผู้บันทึก: หน้าแรก (รอบล่าสุด) · บันทึกรอบ · รายการรอบ · แผนที่
//   admin: + แดชบอร์ด · จัดการ (ฟาร์ม แหล่งกำเนิดเศษอาหาร รถ โครงการ บัญชี ตั้งค่า)
//   super admin: + ส่วนกลาง (องค์กร ประเภทแหล่งกำเนิดเศษอาหาร ตั้งค่าระบบ)
// =====================================================================
const TABS = () => [
  ['#home', 'แดชบอร์ด'], ['#pickups', 'รายการรอบ'], ['#map', 'แผนที่'], ['#routes', 'เส้นทางรถ'], ['#carbon', 'คาร์บอน'], ...((S.hhLinks || []).length ? [['#hh', 'ครัวเรือน AppTech']] : []),
  ...(isAdmin() ? [['#admin', 'จัดการ']] : []), ...(isSuper() ? [['#super', 'ส่วนกลาง']] : []), ['#help', 'ช่วยเหลือ']
];
function renderTabs() { $('#tabs').innerHTML = S.me ? TABS().map(([h, l]) => `<a href="${h}" class="${location.hash.startsWith(h) ? 'active' : ''}">${l}</a>`).join('') : ''; }
window.addEventListener('hashchange', render);
async function render() {
  destroyCharts();
  const view = $('#view');
  try {
    if (!S.me) S.me = await api.me();
    if (location.hash.startsWith('#about')) { renderTabs(); return pageAbout(view); }
    if (!S.me) { renderTabs(); $('#who').textContent = ''; return pageLogin(view, '#home'); }
    await loadCore(); await loadMasters();
    $('#who').textContent = `${S.me.display_name} · ${roleLabel(S.me.role)}${S.me.org_id ? ' · ' + (orgOf(S.me.org_id).code || '') : ''}`;
    Queue.refreshBadge();
    const h = location.hash || '#home'; renderTabs();
    if (h.startsWith('#home')) return pageDashboard(view);   // DEC-111 หน้าแรก = แดชบอร์ด (ทุกบทบาท เห็นเฉพาะองค์กรตน)
    if (h.startsWith('#pickups')) return pagePickups(view);
    if (h.startsWith('#pickup/new')) return pagePickupForm(view, null);
    if (h.startsWith('#pickup-edit/')) return pagePickupForm(view, h.split('/')[1]);
    if (h.startsWith('#pickup/')) return pagePickup(view, h.split('/')[1]);
    if (h.startsWith('#dashboard')) return pageDashboard(view);
    if (h.startsWith('#routes')) return pageRoutes(view);
    if (h.startsWith('#carbon')) return pageCarbon(view);
    if (h.startsWith('#hh')) return pageHH(view);
    if (h.startsWith('#map')) return pageMap(view);
    if (h.startsWith('#admin')) return isAdmin() ? pageAdmin(view) : pageDashboard(view);
    if (h.startsWith('#super')) return isSuper() ? pageSuper(view) : pageDashboard(view);
    if (h.startsWith('#queue')) return pageQueue(view);
    if (h.startsWith('#me')) return pageMe(view);
    if (h.startsWith('#help')) return pageHelp(view);
    return pageDashboard(view);
  } catch (e) { const f = friendlyError(e, 'เปิดหน้านี้ไม่สำเร็จ'); console.error(e); if (f.kind === 'session' && S.me && api.name === 'supabase') return sessionLost();
    view.innerHTML = `<div class="card"><b style="color:var(--danger)">${esc(f.title)}</b>${f.hint ? `<div style="margin-top:6px">${esc(f.hint)}</div>` : ''}${f.raw && f.raw !== f.title ? `<div class="muted" style="margin-top:6px;word-break:break-all">${esc(f.raw)}</div>` : ''}<div class="row" style="margin-top:10px"><button class="secondary" onclick="render()">ลองใหม่</button><button class="secondary" onclick="S.cache={};location.reload()">รีเฟรชทั้งหน้า</button></div></div>`; }
  finally { setTimeout(() => { bindLabels(view); makeSortable(view); }, 0); }
}

// ---- ตารางแม่ของโมดูล (ในขอบเขตองค์กรที่ดูอยู่) ----
async function loadMasters(force) {
  const key = 'm_' + S.scopeOrg;
  if (S.cache[key] && !force) { Object.assign(S, S.cache[key]); return; }
  const [farms, sources, vehicles, types, routes] = await Promise.all([
    api.list('food.farm', { eq: scopeEq(), order: ['name'] }), api.list('food.source', { eq: scopeEq(), order: ['name'] }),
    api.list('food.vehicle', { eq: scopeEq(), order: ['name'] }), api.list('food.source_type', { order: ['sort_order'] }), api.list('food.route', { eq: scopeEq(), order: ['name'] })]);
  let hhLinks = []; try { hhLinks = await api.list('hh.link', { eq: { status: 'active' } }); } catch (e) { hhLinks = []; }   // DEC-117 ยังไม่รัน 014 / ยังไม่เปิดสคีมา hh = ไม่มีเมนู
  S.cache[key] = { farms, sources, vehicles, types, routes, hhLinks }; Object.assign(S, S.cache[key]);
}
const farmOf = id => S.farms.find(f => f.id === id) || {};
const sourceOf = id => S.sources.find(s => s.id === id) || {};
const typeOf = id => S.types.find(t => t.id === id) || {};
const maxPhotos = () => parseInt(setting('max_photos_per_pickup') || '3') || 3;
const QUALITY = { 1: 'ต้องปรับปรุง', 2: 'พอใช้', 3: 'ปานกลาง', 4: 'ดี', 5: 'ดีเยี่ยม' };
const qLabel = q => q == null ? '-' : `${q} ${QUALITY[q] || ''}`;
const canWrite = () => S.me.role !== 'super_admin' || !!S.scopeOrg;
const projectsOfScope = () => S.projects.filter(x => (!S.scopeOrg || x.org_id === S.scopeOrg) && x.status === 'active');
// ตัวกรองโครงการ (DEC-112): ใช้ร่วมทุกหน้า · ผู้บันทึกที่สังกัดโครงการเห็นเฉพาะโครงการตนอยู่แล้ว (RLS)
const projectFilter = (path, cur) => `<select style="width:auto;max-width:300px" aria-label="กรองโครงการวิจัย" onchange="${path}=this.value;render()"><option value="">ทุกโครงการวิจัย</option>${projectsOfScope().map(x => `<option value="${x.id}" ${x.id === cur ? 'selected' : ''}>${esc(x.code)}</option>`).join('')}</select>`;

// =====================================================================
// หน้าแรก: รอบล่าสุด + ปุ่มบันทึก
// =====================================================================
async function pageHome(view) {
  const rows = await api.list('food.v_pickup', { eq: { status: 'active', ...scopeEq() }, order: ['pickup_date', false], order2: ['created_at', false], limit: 15 });
  const month = todayISO().slice(0, 7);
  const mrows = rows.filter(r => r.pickup_date.startsWith(month));
  view.innerHTML = `${scopeSelector()}
    <div class="kpis"><div class="kpi hero"><div class="l">เดือนนี้ (จาก 15 รอบล่าสุดที่แสดง)</div><div class="v">${fmt(sum(mrows, 'total_kg'))} กก.</div></div><div class="kpi"><div class="l">รอบเดือนนี้ในรายการ</div><div class="v">${fmtInt(mrows.length)}</div></div><div class="kpi"><div class="l">ฟาร์มที่ใช้งาน</div><div class="v">${fmtInt(S.farms.filter(f => f.status === 'active').length)}</div></div><div class="kpi"><div class="l">แหล่งกำเนิดเศษอาหารที่ใช้งาน</div><div class="v">${fmtInt(S.sources.filter(s => s.status === 'active').length)}</div></div></div>
    <div class="card"><div class="cardhead"><h4>รอบเข้ารับล่าสุด ${helpBtn('home')}</h4><a href="#pickups">ดูทั้งหมด ›</a></div>
    ${pickupTable(rows, 'tblHome')}</div>
    ${canWrite() ? `<button class="fab" onclick="go('#pickup/new')">＋ บันทึกรอบเข้ารับ</button>` : ''}`;
}
function pickupTable(rows, id = 'tblPickups') {
  const cols = [{ label: 'วันที่', key: 'pickup_date' }, { label: 'ฟาร์ม', key: 'farm_name' }, { label: 'แหล่งกำเนิด', key: 'items', cls: 'num' }, { label: 'กก.', key: 'total_kg', cls: 'num' }, { label: 'คุณภาพ', key: 'avg_quality' }, { label: '' }];
  const row = r => `<tr><td class="nowrap"><a href="#pickup/${r.id}">${thDay(r.pickup_date)}</a>${r.pickup_time ? ' ' + String(r.pickup_time).slice(0, 5) : ''}${r.entry_source === 'sheet' ? ' <span class="pill" title="ย้ายจากชีตเดิม">ชีต</span>' : ''}${r.status !== 'active' ? ' <span class="pill" style="background:#fee2e2">ยกเลิก</span>' : ''}</td><td>${esc(r.farm_name)}<div class="muted">${esc(r.project_code)}</div></td><td class="num">${fmtInt(r.items)}</td><td class="num"><b>${fmt(r.total_kg)}</b></td><td>${r.avg_quality != null ? fmt(r.avg_quality) : '-'}</td><td>${r.photo_count ? '📷' + r.photo_count : ''}</td></tr>`;
  return pagedTable(id, rows, cols, row, { empty: 'ยังไม่มีรอบเข้ารับ', resetPage: true });
}

// =====================================================================
// รายการรอบทั้งหมด + ตัวกรอง + CSV
// =====================================================================
async function pagePickups(view) {
  const st = S._pk = S._pk || { from: '', to: '', farm: '', q: '', project: '' };
  const o = { eq: scopeEq(), order: ['pickup_date', false], order2: ['created_at', false] };
  if (st.from) o.gte = { pickup_date: st.from }; if (st.to) o.lte = { pickup_date: st.to }; if (st.farm) o.eq.farm_id = st.farm; if (st.project) o.eq.project_id = st.project;
  const rows = await api.list('food.v_pickup', o);
  const f = rows.filter(r => !st.q || [r.farm_name, r.note, r.created_by_name].join(' ').toLowerCase().includes(st.q.toLowerCase()));
  S._pkRows = f;
  view.innerHTML = `${scopeSelector()}<div class="card"><div class="cardhead"><h4>รายการรอบเข้ารับ (${fmtInt(f.length)}) ${helpBtn('pickups')}</h4><button class="small secondary" onclick="exportPickups()">ส่งออก CSV</button></div>
    <div class="row"><select style="width:auto;max-width:360px" onchange="S._pk.project=this.value;render()"><option value="">ทุกโครงการวิจัย</option>${projectsOfScope().map(x => `<option value="${x.id}" ${x.id === st.project ? 'selected' : ''}>${esc(x.code)}</option>`).join('')}</select><label style="margin:0">ตั้งแต่ <input type="date" value="${st.from}" onchange="S._pk.from=this.value;render()" style="width:auto"></label><label style="margin:0">ถึง <input type="date" value="${st.to}" onchange="S._pk.to=this.value;render()" style="width:auto"></label>
      <select style="width:auto" onchange="S._pk.farm=this.value;render()"><option value="">ทุกฟาร์ม</option>${S.farms.map(x => `<option value="${x.id}" ${x.id === st.farm ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
      <input type="search" placeholder="ค้นหา…" value="${esc(st.q)}" onchange="S._pk.q=this.value;render()" style="flex:1;min-width:140px"></div>
    <div class="muted" style="margin:6px 0">รวม <b>${fmt(sum(f, 'total_kg'))}</b> กก. · ${fmtInt(f.length)} รอบ</div>
    ${pickupTable(f, 'tblPickupsAll')}</div>
    ${canWrite() ? `<button class="fab" onclick="go('#pickup/new')">＋ บันทึกรอบเข้ารับ</button>` : ''}`;
}
async function exportPickups() {
  const ids = (S._pkRows || []).map(r => r.id); if (!ids.length) return toast('ไม่มีข้อมูล', true);
  const items = await api.list('food.v_pickup_item', { eq: { status: 'active', ...scopeEq() }, order: ['pickup_date'] });
  const set = new Set(ids);
  exportCsv(items.filter(i => set.has(i.pickup_id)).map(i => ({ วันที่: i.pickup_date, เวลา: i.pickup_time || '', ฟาร์ม: i.farm_name, โครงการ: i.project_code, แหล่งกำเนิดเศษอาหาร: i.source_name, ประเภทแหล่งกำเนิดเศษอาหาร: i.source_type_name || '', น้ำหนัก_กก: i.weight_kg, คะแนนคัดแยก: i.quality ?? '', หมายเหตุ: i.note || '', ผู้บันทึก: i.created_by_name || 'ย้ายจากชีตเดิม' })), 'pickup_items');
}

// =====================================================================
// รายละเอียดรอบ
// =====================================================================
async function pagePickup(view, id) {
  const [p] = await api.list('food.v_pickup', { eq: { id } }); if (!p) return view.innerHTML = '<div class="card">ไม่พบรอบเข้ารับ</div>';
  const items = await api.list('food.v_pickup_item', { eq: { pickup_id: id }, order: ['source_name'] });
  const photos = await api.list('food.pickup_photo', { eq: { pickup_id: id, status: 'active' }, order: ['seq'] });
  const act = items.filter(i => i.status === 'active');
  view.innerHTML = `<div class="card">
    <div class="row" style="justify-content:space-between"><h3 style="margin:0">${thDay(p.pickup_date)}${p.pickup_time ? ' ' + String(p.pickup_time).slice(0, 5) + ' น.' : ''}</h3>${p.status !== 'active' ? '<span class="pill" style="background:#fee2e2">ยกเลิกแล้ว</span>' : ''}</div>
    <div style="font-size:18px">${esc(p.farm_name)}</div><div class="muted">โครงการวิจัย: <b>${esc(p.project_code)}</b> ${esc(p.project_name)} ${p.project_overridden ? '<span class="pill">เลือกเองในรอบนี้</span>' : '<span class="pill">ตามฟาร์ม</span>'}</div>
    <div class="muted">${p.vehicle_name ? 'รถ ' + esc(p.vehicle_name) + ' · ' : ''}${p.distance_km != null ? 'ระยะทาง ' + fmt(p.distance_km) + ' กม. · ' : ''}บันทึกโดย ${esc(p.created_by_name || (p.entry_source === 'sheet' ? 'ย้ายจากชีตเดิม' : '-'))} · ${thDate(p.created_at)}</div>
    ${p.note ? `<div style="margin-top:6px">หมายเหตุ: ${esc(p.note)}</div>` : ''}
    <div class="kpis" style="margin-top:10px"><div class="kpi hero"><div class="l">รวม</div><div class="v">${fmt(p.total_kg)} กก.</div></div><div class="kpi"><div class="l">แหล่งกำเนิดเศษอาหาร</div><div class="v">${fmtInt(act.length)}</div></div><div class="kpi"><div class="l">คะแนนคัดแยกเฉลี่ย</div><div class="v">${p.avg_quality != null ? fmt(p.avg_quality) : '-'}</div></div></div>
    <table style="margin-top:10px"><thead><tr><th>แหล่งกำเนิดเศษอาหาร</th><th class="num">กก.</th><th>คะแนนคัดแยก</th><th>หมายเหตุ</th></tr></thead><tbody>${items.map(i => `<tr style="${i.status !== 'active' ? 'opacity:.5' : ''}"><td>${esc(i.source_name)}${i.status !== 'active' ? ' <span class="pill">ยกเลิก</span>' : ''}</td><td class="num">${fmt(i.weight_kg)}</td><td>${qLabel(i.quality)}</td><td class="muted">${esc(i.note || '')}</td></tr>`).join('')}</tbody></table>
    <h4>รูป (${photos.length}/${maxPhotos()})</h4><div class="photos" id="photos">${photos.map(ph => `<div style="text-align:center"><a href="${esc(ph.url)}" target="_blank" rel="noopener"><img src="${esc(ph.url)}" alt="รูปรอบเข้ารับ" loading="lazy" onerror="photoMissing(this)"></a>${isAdmin() && p.status === 'active' ? `<button class="small danger" style="margin-top:4px" onclick="cancelRow('food.pickup_photo','${ph.id}','รูป')">เอาออก</button>` : ''}</div>`).join('') || '<span class="muted">ไม่มีรูป</span>'}</div>
    ${p.status === 'active' && canWrite() && photos.length < maxPhotos() ? `<div class="row" style="margin-top:8px"><label class="btn secondary" style="margin:0;display:inline-flex;align-items:center">📷 ถ่ายรูป<input type="file" accept="image/*" capture="environment" class="hidden" onchange="addPhoto('${p.id}',this.files[0]);this.value=''"></label><label class="btn secondary" style="margin:0;display:inline-flex;align-items:center">🖼 เลือกจากคลัง<input type="file" accept="image/*" class="hidden" onchange="addPhoto('${p.id}',this.files[0]);this.value=''"></label></div>` : ''}
    <div class="row" style="margin-top:14px">${p.status === 'active' && canWrite() ? `<button onclick="go('#pickup-edit/${p.id}')">แก้ไข</button>` : ''}${isAdmin() && p.status === 'active' ? `<button class="danger" onclick="cancelRow('food.pickup','${p.id}','รอบเข้ารับนี้')">ยกเลิกรอบ</button>` : ''}<a class="btn secondary" style="text-decoration:none" href="#pickups">กลับ</a></div></div>`;
}
async function cancelRow(table, id, label) {
  if (!confirm(`ยกเลิก${label}? ข้อมูลยังอยู่ในระบบแต่จะไม่นับรวม`)) return;
  try { await api.update(table, id, { status: 'inactive' }); toast('ยกเลิกแล้ว'); render(); } catch (e) { fail(e, 'ยกเลิกไม่สำเร็จ'); }
}

// =====================================================================
// ฟอร์มบันทึก/แก้ไขรอบ — 1 รอบ = 1 ฟาร์ม หลายแหล่งกำเนิดเศษอาหาร (DEC-106 ข้อ 6)
// =====================================================================
async function pagePickupForm(view, id) {
  if (!canWrite()) return view.innerHTML = '<div class="card">เลือกองค์กรก่อน</div>';
  let p = null, items = [];
  if (id) { [p] = await api.list('food.pickup', { eq: { id } }); if (!p) return view.innerHTML = '<div class="card">ไม่พบรอบ</div>'; items = await api.list('food.pickup_item', { eq: { pickup_id: id, status: 'active' } }); }
  let lastFarm = ''; try { lastFarm = localStorage.getItem('food_last_farm') || ''; } catch {}
  const myPj = S.me.role === 'recorder' ? (S.me.project_id || '') : '';   // DEC-112 ผู้บันทึกที่สังกัดโครงการ เห็นเฉพาะฟาร์มของโครงการนั้น
  const farms = S.farms.filter(f => (f.status === 'active' || (p && f.id === p.farm_id)) && (!myPj || f.project_id === myPj));
  if (!farms.some(f => f.id === lastFarm)) lastFarm = (farms[0] || {}).id || '';   // ฟาร์มที่จำไว้ไม่มีแล้ว → ใช้ตัวแรก
  const srcs = S.sources.filter(s => s.status === 'active' || items.some(i => i.source_id === s.id));
  const itemOf = sid => items.find(i => i.source_id === sid) || {};
  S._newPhotos = [];
  view.innerHTML = `<div class="card formbox"><h3 style="margin-top:0">${id ? 'แก้ไขรอบเข้ารับ' : 'บันทึกรอบเข้ารับ'} ${helpBtn('pickup-new')}</h3>
    <div class="fgrid">
      <div><label>ฟาร์มที่เข้ารับ *</label><select id="f_farm">${farms.length ? '' : '<option value="">— ยังไม่มีฟาร์ม ให้ admin เพิ่มที่เมนูจัดการ —</option>'}${farms.map(f => `<option value="${f.id}" ${(p ? p.farm_id : lastFarm) === f.id ? 'selected' : ''}>${esc(f.name)}${f.status !== 'active' ? ' (ปิด)' : ''}</option>`).join('')}</select></div>

async function savePickup(id, oldItems) {

  const reset = () => { b.disabled = false; b.textContent = id ? 'บันทึกการแก้ไข' : 'บันทึก'; };
  const farmId = $('#f_farm').value; if (!farmId) { reset(); return needField('#f_farm', 'เลือกฟาร์มที่เข้ารับ'); }

  const lit = $('#f_liters') ? $('#f_liters').value : ''; if (lit !== '' && (isNaN(+lit) || +lit < 0)) { reset(); return needField('#f_liters', 'ลิตรต้องเป็นตัวเลขไม่ติดลบ'); }
  const rows = [...document.querySelectorAll('.itemrow[data-sid]:not(.hidden)')].map(r => ({ source_id: r.dataset.sid, kgEl: r.querySelector('.kg'), kg: r.querySelector('.kg').value, quality: r.querySelector('.q').value }));
  for (const r of rows) { if (r.kg !== '' && (isNaN(+r.kg) || +r.kg < 0)) { reset(); return needField(r.kgEl, 'น้ำหนักต้องเป็นตัวเลขไม่ติดลบ'); } if (r.kg === '' && r.quality !== '') { reset(); return needField(r.kgEl, 'ใส่คะแนนแล้วต้องกรอกน้ำหนักด้วย (ไม่ได้รับ = เว้นทั้งสองช่อง)'); } }
  const filled = rows.filter(r => r.kg !== '');
  if (!filled.length) { reset(); return needField(rows[0] && rows[0].kgEl, 'กรอกน้ำหนักอย่างน้อย 1 แหล่งกำเนิดเศษอาหาร'); }
  const unlocked = isSuper() && $('#f_unlock') && $('#f_unlock').checked;   // DEC-112: ส่ง null ให้ฐานข้อมูลล็อกตามฟาร์ม · super ปลดล็อกจึงส่งค่าเอง
  const pickup = { farm_id: farmId, project_id: unlocked ? ($('#f_project').value || null) : null, pickup_date: date, pickup_time: $('#f_time').value || null, vehicle_id: $('#f_vehicle').value || null, distance_km: km === '' ? null : +km, note: $('#f_note').value.trim() || null };
  if (isSuper()) pickup.org_id = S.scopeOrg;
  const rsel = $('#f_route') ? $('#f_route').value : '';   // DEC-113: ส่งเฉพาะเมื่อมีค่า (ใช้ได้แม้ฐานข้อมูลยังไม่รัน 009)

    }
    const photos = []; for (const f of S._newPhotos) { toast('กำลังย่อรูป…'); photos.push(await compressImage(f)); }
    const payload = { pickup, items, photos, farm_name: farmOf(farmId).name, org_id: S.scopeOrg || S.me.org_id };

// ส่งรอบ + รายการ + รูป (ใช้ทั้งตอนออนไลน์และตอนคิวส่งภายหลัง) · คืน id ของรอบ
async function submitPickup(payload) {
  const row = await api.insert('food.pickup', payload.pickup);
  await api.insertMany('food.pickup_item', payload.items.map(it => ({ ...it, pickup_id: row.id })));
  for (const ph of payload.photos || []) {
    try { await savePhoto(row.id, ph, payload.org_id); }
    catch (e) { if (isNetworkError(e)) { await Queue.push({ kind: 'photo', payload: { pickup_id: row.id, photo: ph, org_id: payload.org_id }, label: `รูปของรอบ ${payload.farm_name}` }); } else fail(e, 'ส่งรูปไม่สำเร็จ (บันทึกรอบแล้ว)'); }
  }
  return row.id;
}
Queue.handlers.pickup = async payload => { await submitPickup(payload); };
Queue.handlers.photo = async payload => { await savePhoto(payload.pickup_id, payload.photo, payload.org_id); };
async function savePhoto(pickupId, ph, orgId) {
  const org = orgOf(orgId || S.scopeOrg || S.me.org_id);
  const endpoint = org.photo_endpoint_url || setting('default_photo_endpoint_url') || '';
  const existing = await api.list('food.pickup_photo', { eq: { pickup_id: pickupId, status: 'active' } });
  if (existing.length >= maxPhotos()) throw new Error(`รอบนี้มีรูปครบ ${maxPhotos()} รูปแล้ว`);
  const up = await api.uploadPhoto(endpoint, { ...ph, org_code: org.code, label: 'pickup', filename: `pickup_${Date.now()}.jpg` });
  return api.insert('food.pickup_photo', { pickup_id: pickupId, seq: existing.length + 1, storage_kind: 'gdrive', file_id: up.file_id, url: up.url, taken_at: new Date().toISOString() });
}
async function addPhoto(pickupId, file) {
  if (!file) return; toast('กำลังย่อและส่งรูป…');
  try { const ph = await compressImage(file); try { await savePhoto(pickupId, ph); toast('เพิ่มรูปแล้ว'); } catch (e) { if (!isNetworkError(e)) throw e; await Queue.push({ kind: 'photo', payload: { pickup_id: pickupId, photo: ph }, label: 'รูป (เพิ่มภายหลัง)' }); toast('ไม่มีสัญญาณ เก็บรูปไว้ส่งภายหลัง'); } render(); } catch (e) { fail(e); }
}

// จุดแวะ: เพิ่มได้หลายจุดต่อเนื่องโดยไม่วาดหน้าใหม่ · ลากย้าย/คลิกลบ · ตัวนับในแถบฟ้าอัปเดตทันที
function addVia(latlng) { const st = S._rt; st.via.push([+latlng.lat.toFixed(6), +latlng.lng.toFixed(6)]); drawVia(); toast(`เพิ่มจุดแวะที่ ${st.via.length} แล้ว · กด "คำนวณใหม่ตามจุดแวะ" เมื่อวางครบ`); }
function drawVia() {
  const st = S._rt; const g = S._viaLayer; if (!g) return; g.clearLayers();
  st.via.forEach((v, i) => { const m = L.marker([v[0], v[1]], { draggable: true, icon: L.divIcon({ className: 'seqlbl', html: `<div style="background:#F9A825;color:#000;border-radius:50%;width:22px;height:22px;border:2px solid #fff;line-height:18px">${i + 1}</div>`, iconSize: [22, 22], iconAnchor: [11, 11] }) }).addTo(g); m.on('dragend', e => { const ll = e.target.getLatLng(); st.via[i] = [+ll.lat.toFixed(6), +ll.lng.toFixed(6)]; }); m.on('click', e => { L.DomEvent.stop(e); if (confirm(`ลบจุดแวะที่ ${i + 1}?`)) { st.via.splice(i, 1); drawVia(); } }); });
  const c = $('#viaCount'); if (c) c.textContent = st.via.length;
}
// ลำดับจุด: เริ่ม → จุดรับที่มีพิกัด → ฟาร์ม
function routePoints(r, stops) {
  const pts = [];
  if (r.start_lat != null) pts.push({ lat: +r.start_lat, lng: +r.start_lng, k: 'start' });
  stops.filter(x => x.lat != null).forEach(x => pts.push({ lat: +x.lat, lng: +x.lng, k: 'stop' }));
  if (r.farm_lat != null) pts.push({ lat: +r.farm_lat, lng: +r.farm_lng, k: 'farm' });
  return pts;
}
// แทรกจุดแวะเข้าไปในลำดับ ตรงช่วงที่ทำให้ระยะเพิ่มน้อยที่สุด
function insertVia(pts, via) {
  const d = (a, b) => Math.hypot(a.lat - b.lat, (a.lng - b.lng) * Math.cos(a.lat * Math.PI / 180));
  const out = pts.slice();
  for (const v of via || []) { const p = { lat: v[0], lng: v[1], k: 'via' }; let best = 1, bestCost = Infinity; for (let i = 1; i < out.length; i++) { const c = d(out[i - 1], p) + d(p, out[i]) - d(out[i - 1], out[i]); if (c < bestCost) { bestCost = c; best = i; } } out.splice(best, 0, p); }
  return out;
}
async function computeRoute(routeId, via) {
  try {
    const [r] = await api.list('food.v_route', { eq: { id: routeId } }); const stops = await api.list('food.v_route_stop', { eq: { route_id: routeId }, order: ['seq'] });
    const base = routePoints(r, stops);
    if (!r.start_lat && r.start_lat !== 0) return toastErr('ยังไม่มีจุดเริ่มต้น', 'กด "แก้" แล้วใส่พิกัดจุดเริ่มต้นก่อน');
    if (r.farm_lat == null) return toastErr('ฟาร์มปลายทางยังไม่มีพิกัด', 'ใส่ได้ที่ จัดการ → ฟาร์ม → แก้ → ใช้ค่านี้/ใช้ GPS');
    if (base.length < 2) return toastErr('จุดไม่พอ', 'ต้องมีจุดเริ่มต้นและปลายทางอย่างน้อย');
    const useVia = via !== undefined ? via : (r.via || []);
    const seq = base.slice(); if (r.round_trip && base[0] && base[0].k === 'start') seq.push({ ...base[0], k: 'back' });   // ไป–กลับ: ต่อขากลับจุดเริ่มต้นก่อน
    const pts = insertVia(seq, useVia);   // จุดแวะแทรกได้ทั้งขาไปและขากลับ (เลือกช่วงที่ระยะเพิ่มน้อยสุด)
    toast('กำลังคำนวณเส้นทางบนถนน…');
    const coords = pts.map(p => `${p.lng},${p.lat}`).join(';');
    const res = await fetch(`${CONFIG.ROUTING_URL}/route/v1/driving/${coords}?overview=full&geometries=geojson&steps=false`);
    if (!res.ok) throw new Error('บริการเส้นทาง OSRM ตอบ ' + res.status);
    const j = await res.json(); if (j.code !== 'Ok' || !j.routes || !j.routes[0]) throw new Error('บริการเส้นทาง OSRM หาเส้นทางไม่ได้: ' + (j.message || j.code));
    const rt = j.routes[0];
    await api.update('food.route', routeId, { path: rt.geometry, path_distance_m: Math.round(rt.distance * 10) / 10, path_duration_s: Math.round(rt.duration), path_source: 'osrm', path_at: new Date().toISOString(), via: useVia });
    toast(`ได้เส้นทาง ${fmt(rt.distance / 1000, 1)} กม. · ${fmtInt(rt.duration / 60)} นาที`); render();
  } catch (e) { fail(e, 'คำนวณเส้นทางไม่สำเร็จ'); }
}

    <label>หมายเหตุ/ตารางวิ่ง</label><input id="r_sched" value="${esc(r.schedule_note || '')}" placeholder="เช่น ทุกอังคาร/ศุกร์ 15:00">

function rtStartKind() { const other = $('#r_startkind').value === 'other'; $('#r_startOther').classList.toggle('hidden', !other); }
function rtDrawStops() { const box = $('#r_stops'); if (!box) return; box.innerHTML = S._rtEdit.stops.map((sid, i) => `<div class="stoprow"><b>${i + 1}.</b><span class="nm">${esc(sourceOf(sid).name || '?')}${sourceOf(sid).lat == null ? ' <span class="pill">ไม่มีพิกัด</span>' : ''}</span><button type="button" class="small secondary" onclick="rtMove(${i},-1)" ${i === 0 ? 'disabled' : ''}>▲</button><button type="button" class="small secondary" onclick="rtMove(${i},1)" ${i === S._rtEdit.stops.length - 1 ? 'disabled' : ''}>▼</button><button type="button" class="small danger" onclick="S._rtEdit.stops.splice(${i},1);rtDrawStops()">×</button></div>`).join('') || '<div class="muted">ยังไม่มีจุดรับ (เส้นทางจะวิ่งจากจุดเริ่มต้นไปฟาร์มโดยตรง)</div>'; }
function rtAddStop() { const v = $('#r_add').value; if (!v) return; if (S._rtEdit.stops.includes(v)) return toast('มีจุดนี้แล้ว', true); S._rtEdit.stops.push(v); $('#r_add').value = ''; rtDrawStops(); }
function rtMove(i, d) { const a = S._rtEdit.stops; const j = i + d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; rtDrawStops(); }

async function pageAdmin(view) {
  const tab = location.hash.split('/')[1] || 'farm';
  const tabs = [['farm', 'ฟาร์ม'], ['source', 'แหล่งกำเนิดเศษอาหาร'], ['vehicle', 'รถ'], ['project', 'โครงการวิจัย'], ['carbon', 'ค่าคาร์บอน'], ['users', 'บัญชี'], ['settings', 'ตั้งค่า']];
  let body = '';
  if (tab === 'farm') body = await crudSection({ ...SPECS['food.farm'], eq: scopeEq() });
  else if (tab === 'source') body = await crudSection({ ...SPECS['food.source'], eq: scopeEq() });
  else if (tab === 'vehicle') body = await crudSection({ ...SPECS['food.vehicle'], eq: scopeEq() });
  else if (tab === 'project') body = await crudSection({ ...SPECS['core.project'], eq: scopeEq() });
  else if (tab === 'carbon') body = await crudSection(SPECS['food.carbon_factor']);
  else if (tab === 'users') body = await usersSection();
  else body = orgSettings();
