<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>บันทึกการเข้ารับเศษอาหาร</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="../common.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../common.js"></script>
</head>
<body>
<header>
  <h1 id="title"><a href="../">UBRU AppTech</a> › บันทึกการเข้ารับเศษอาหาร</h1>
  <span id="who" class="muted" style="color:#dbeafe;font-size:13px"></span>
  <button id="btnQueue" class="hidden" onclick="go('#queue')">รอส่ง <b id="queueCount">0</b></button>
  <button onclick="go('#me')">บัญชี</button>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="view"></main>
<footer class="credit" id="credit"></footer>
<div id="toastHost" role="status" aria-live="polite"></div>

<script>
// =====================================================================
// โมดูล: บันทึกการเข้ารับเศษอาหาร (food) — DEC-106
//   ผู้บันทึก: หน้าแรก (รอบล่าสุด) · บันทึกรอบ · รายการรอบ · แผนที่
//   admin: + แดชบอร์ด · จัดการ (ฟาร์ม แหล่ง รถ โครงการ บัญชี ตั้งค่า)
//   super admin: + ส่วนกลาง (องค์กร ประเภทแหล่ง ตั้งค่าระบบ)
// =====================================================================
const TABS = () => [
  ['#home', 'หน้าแรก'], ['#pickups', 'รายการรอบ'], ...(isAdmin() ? [['#dashboard', 'แดชบอร์ด']] : []), ['#map', 'แผนที่'],
  ...(isAdmin() ? [['#admin', 'จัดการ']] : []), ...(isSuper() ? [['#super', 'ส่วนกลาง']] : []), ['#help', 'ช่วยเหลือ']
];
function renderTabs() { $('#tabs').innerHTML = S.me ? TABS().map(([h, l]) => `<a href="${h}" class="${location.hash.startsWith(h) ? 'active' : ''}">${l}</a>`).join('') : ''; }
window.addEventListener('hashchange', render);
async function render() {
  destroyCharts();
  const view = $('#view');
  try {
    if (!S.me) S.me = await api.me();
    if (location.hash.startsWith('#about')) { renderTabs(); return pageAbout(view); }
    if (!S.me) { renderTabs(); $('#who').textContent = ''; return pageLogin(view, '#home'); }
    await loadCore(); await loadMasters();
    $('#who').textContent = `${S.me.display_name} · ${roleLabel(S.me.role)}${S.me.org_id ? ' · ' + (orgOf(S.me.org_id).code || '') : ''}`;
    Queue.refreshBadge();
    const h = location.hash || '#home'; renderTabs();
    if (h.startsWith('#home')) return pageHome(view);
    if (h.startsWith('#pickups')) return pagePickups(view);
    if (h.startsWith('#pickup/new')) return pagePickupForm(view, null);
    if (h.startsWith('#pickup-edit/')) return pagePickupForm(view, h.split('/')[1]);
    if (h.startsWith('#pickup/')) return pagePickup(view, h.split('/')[1]);
    if (h.startsWith('#dashboard')) return isAdmin() ? pageDashboard(view) : pageHome(view);
    if (h.startsWith('#map')) return pageMap(view);
    if (h.startsWith('#admin')) return isAdmin() ? pageAdmin(view) : pageHome(view);
    if (h.startsWith('#super')) return isSuper() ? pageSuper(view) : pageHome(view);
    if (h.startsWith('#queue')) return pageQueue(view);
    if (h.startsWith('#me')) return pageMe(view);
    if (h.startsWith('#help')) return pageHelp(view);
    return pageHome(view);
  } catch (e) { const f = friendlyError(e, 'เปิดหน้านี้ไม่สำเร็จ'); console.error(e); if (f.kind === 'session' && S.me && api.name === 'supabase') return sessionLost();
    view.innerHTML = `<div class="card"><b style="color:var(--danger)">${esc(f.title)}</b>${f.hint ? `<div style="margin-top:6px">${esc(f.hint)}</div>` : ''}${f.raw && f.raw !== f.title ? `<div class="muted" style="margin-top:6px;word-break:break-all">${esc(f.raw)}</div>` : ''}<div class="row" style="margin-top:10px"><button class="secondary" onclick="render()">ลองใหม่</button><button class="secondary" onclick="S.cache={};location.reload()">รีเฟรชทั้งหน้า</button></div></div>`; }
  finally { setTimeout(() => { bindLabels(view); makeSortable(view); }, 0); }
}

// ---- ตารางแม่ของโมดูล (ในขอบเขตองค์กรที่ดูอยู่) ----
async function loadMasters(force) {
  const key = 'm_' + S.scopeOrg;
  if (S.cache[key] && !force) { Object.assign(S, S.cache[key]); return; }
  const [farms, sources, vehicles, types] = await Promise.all([
    api.list('food.farm', { eq: scopeEq(), order: ['name'] }), api.list('food.source', { eq: scopeEq(), order: ['name'] }),
    api.list('food.vehicle', { eq: scopeEq(), order: ['name'] }), api.list('food.source_type', { order: ['sort_order'] })]);
  S.cache[key] = { farms, sources, vehicles, types }; Object.assign(S, S.cache[key]);
}
const farmOf = id => S.farms.find(f => f.id === id) || {};
const sourceOf = id => S.sources.find(s => s.id === id) || {};
const typeOf = id => S.types.find(t => t.id === id) || {};
const maxPhotos = () => parseInt(setting('max_photos_per_pickup') || '3') || 3;
const QUALITY = { 1: 'ต้องปรับปรุง', 2: 'พอใช้', 3: 'ปานกลาง', 4: 'ดี', 5: 'ดีเยี่ยม' };
const qLabel = q => q == null ? '-' : `${q} ${QUALITY[q] || ''}`;
const canWrite = () => S.me.role !== 'super_admin' || !!S.scopeOrg;

// =====================================================================
// หน้าแรก: รอบล่าสุด + ปุ่มบันทึก
// =====================================================================
async function pageHome(view) {
  const rows = await api.list('food.v_pickup', { eq: { status: 'active', ...scopeEq() }, order: ['pickup_date', false], order2: ['created_at', false], limit: 15 });
  const month = todayISO().slice(0, 7);
  const mrows = rows.filter(r => r.pickup_date.startsWith(month));
  view.innerHTML = `${scopeSelector()}
    <div class="kpis"><div class="kpi hero"><div class="l">เดือนนี้ (จาก 15 รอบล่าสุดที่แสดง)</div><div class="v">${fmt(sum(mrows, 'total_kg'))} กก.</div></div><div class="kpi"><div class="l">รอบเดือนนี้ในรายการ</div><div class="v">${fmtInt(mrows.length)}</div></div><div class="kpi"><div class="l">ฟาร์มที่ใช้งาน</div><div class="v">${fmtInt(S.farms.filter(f => f.status === 'active').length)}</div></div><div class="kpi"><div class="l">แหล่งที่ใช้งาน</div><div class="v">${fmtInt(S.sources.filter(s => s.status === 'active').length)}</div></div></div>
    <div class="card"><div class="cardhead"><h4>รอบเข้ารับล่าสุด ${helpBtn('home')}</h4><a href="#pickups">ดูทั้งหมด ›</a></div>
    ${pickupTable(rows)}</div>
    ${canWrite() ? `<button class="fab" onclick="go('#pickup/new')">＋ บันทึกรอบเข้ารับ</button>` : ''}`;
}
function pickupTable(rows) {
  return `<div style="overflow:auto"><table><thead><tr><th>วันที่</th><th>ฟาร์ม</th><th class="num">แหล่ง</th><th class="num">กก.</th><th>คุณภาพ</th><th></th></tr></thead><tbody>${rows.map(r => `<tr><td data-sort-value="${r.pickup_date}"><a href="#pickup/${r.id}">${thDay(r.pickup_date)}</a>${r.pickup_time ? ' ' + String(r.pickup_time).slice(0, 5) : ''}${r.entry_source === 'sheet' ? ' <span class="pill" title="ย้ายจากชีตเดิม">ชีต</span>' : ''}${r.status !== 'active' ? ' <span class="pill" style="background:#fee2e2">ยกเลิก</span>' : ''}</td><td>${esc(r.farm_name)}<div class="muted">${esc(r.project_code)}</div></td><td class="num">${fmtInt(r.items)}</td><td class="num"><b>${fmt(r.total_kg)}</b></td><td>${r.avg_quality != null ? fmt(r.avg_quality) : '-'}</td><td>${r.photo_count ? '📷' + r.photo_count : ''}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">ยังไม่มีรอบเข้ารับ</td></tr>'}</tbody></table></div>`;
}

// =====================================================================
// รายการรอบทั้งหมด + ตัวกรอง + CSV
// =====================================================================
async function pagePickups(view) {
  const st = S._pk = S._pk || { from: '', to: '', farm: '', q: '' };
  const o = { eq: scopeEq(), order: ['pickup_date', false], order2: ['created_at', false] };
  if (st.from) o.gte = { pickup_date: st.from }; if (st.to) o.lte = { pickup_date: st.to }; if (st.farm) o.eq.farm_id = st.farm;
  const rows = await api.list('food.v_pickup', o);
  const f = rows.filter(r => !st.q || [r.farm_name, r.note, r.created_by_name].join(' ').toLowerCase().includes(st.q.toLowerCase()));
  S._pkRows = f;
  view.innerHTML = `${scopeSelector()}<div class="card"><div class="cardhead"><h4>รายการรอบเข้ารับ (${fmtInt(f.length)}) ${helpBtn('pickups')}</h4><button class="small secondary" onclick="exportPickups()">ส่งออก CSV</button></div>
    <div class="row"><label style="margin:0">ตั้งแต่ <input type="date" value="${st.from}" onchange="S._pk.from=this.value;render()" style="width:auto"></label><label style="margin:0">ถึง <input type="date" value="${st.to}" onchange="S._pk.to=this.value;render()" style="width:auto"></label>
      <select style="width:auto" onchange="S._pk.farm=this.value;render()"><option value="">ทุกฟาร์ม</option>${S.farms.map(x => `<option value="${x.id}" ${x.id === st.farm ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
      <input type="search" placeholder="ค้นหา…" value="${esc(st.q)}" onchange="S._pk.q=this.value;render()" style="flex:1;min-width:140px"></div>
    <div class="muted" style="margin:6px 0">รวม <b>${fmt(sum(f, 'total_kg'))}</b> กก. · ${fmtInt(f.length)} รอบ</div>
    ${pickupTable(f)}</div>
    ${canWrite() ? `<button class="fab" onclick="go('#pickup/new')">＋ บันทึกรอบเข้ารับ</button>` : ''}`;
}
async function exportPickups() {
  const ids = (S._pkRows || []).map(r => r.id); if (!ids.length) return toast('ไม่มีข้อมูล', true);
  const items = await api.list('food.v_pickup_item', { eq: { status: 'active', ...scopeEq() }, order: ['pickup_date'] });
  const set = new Set(ids);
  exportCsv(items.filter(i => set.has(i.pickup_id)).map(i => ({ วันที่: i.pickup_date, เวลา: i.pickup_time || '', ฟาร์ม: i.farm_name, โครงการ: i.project_code, แหล่ง: i.source_name, ประเภทแหล่ง: i.source_type_name || '', น้ำหนัก_กก: i.weight_kg, คะแนนคัดแยก: i.quality ?? '', หมายเหตุ: i.note || '', ผู้บันทึก: i.created_by_name || 'ย้ายจากชีตเดิม' })), 'pickup_items');
}

// =====================================================================
// รายละเอียดรอบ
// =====================================================================
async function pagePickup(view, id) {
  const [p] = await api.list('food.v_pickup', { eq: { id } }); if (!p) return view.innerHTML = '<div class="card">ไม่พบรอบเข้ารับ</div>';
  const items = await api.list('food.v_pickup_item', { eq: { pickup_id: id }, order: ['source_name'] });
  const photos = await api.list('food.pickup_photo', { eq: { pickup_id: id, status: 'active' }, order: ['seq'] });
  const act = items.filter(i => i.status === 'active');
  view.innerHTML = `<div class="card">
    <div class="row" style="justify-content:space-between"><h3 style="margin:0">${thDay(p.pickup_date)}${p.pickup_time ? ' ' + String(p.pickup_time).slice(0, 5) + ' น.' : ''}</h3>${p.status !== 'active' ? '<span class="pill" style="background:#fee2e2">ยกเลิกแล้ว</span>' : ''}</div>
    <div style="font-size:18px">${esc(p.farm_name)} <span class="muted">· ${esc(p.project_name)}</span></div>
    <div class="muted">${p.vehicle_name ? 'รถ ' + esc(p.vehicle_name) + ' · ' : ''}${p.distance_km != null ? 'ระยะทาง ' + fmt(p.distance_km) + ' กม. · ' : ''}บันทึกโดย ${esc(p.created_by_name || (p.entry_source === 'sheet' ? 'ย้ายจากชีตเดิม' : '-'))} · ${thDate(p.created_at)}</div>
    ${p.note ? `<div style="margin-top:6px">หมายเหตุ: ${esc(p.note)}</div>` : ''}
    <div class="kpis" style="margin-top:10px"><div class="kpi hero"><div class="l">รวม</div><div class="v">${fmt(p.total_kg)} กก.</div></div><div class="kpi"><div class="l">แหล่ง</div><div class="v">${fmtInt(act.length)}</div></div><div class="kpi"><div class="l">คะแนนคัดแยกเฉลี่ย</div><div class="v">${p.avg_quality != null ? fmt(p.avg_quality) : '-'}</div></div></div>
    <table style="margin-top:10px"><thead><tr><th>แหล่ง</th><th class="num">กก.</th><th>คะแนนคัดแยก</th><th>หมายเหตุ</th></tr></thead><tbody>${items.map(i => `<tr style="${i.status !== 'active' ? 'opacity:.5' : ''}"><td>${esc(i.source_name)}${i.status !== 'active' ? ' <span class="pill">ยกเลิก</span>' : ''}</td><td class="num">${fmt(i.weight_kg)}</td><td>${qLabel(i.quality)}</td><td class="muted">${esc(i.note || '')}</td></tr>`).join('')}</tbody></table>
    <h4>รูป (${photos.length}/${maxPhotos()})</h4><div class="photos" id="photos">${photos.map(ph => `<div style="text-align:center"><a href="${esc(ph.url)}" target="_blank" rel="noopener"><img src="${esc(ph.url)}" alt="รูปรอบเข้ารับ" loading="lazy" onerror="photoMissing(this)"></a>${isAdmin() && p.status === 'active' ? `<button class="small danger" style="margin-top:4px" onclick="cancelRow('food.pickup_photo','${ph.id}','รูป')">เอาออก</button>` : ''}</div>`).join('') || '<span class="muted">ไม่มีรูป</span>'}</div>
    ${p.status === 'active' && canWrite() && photos.length < maxPhotos() ? `<div class="row" style="margin-top:8px"><label class="btn secondary" style="margin:0;display:inline-flex;align-items:center">📷 ถ่ายรูป<input type="file" accept="image/*" capture="environment" class="hidden" onchange="addPhoto('${p.id}',this.files[0]);this.value=''"></label><label class="btn secondary" style="margin:0;display:inline-flex;align-items:center">🖼 เลือกจากคลัง<input type="file" accept="image/*" class="hidden" onchange="addPhoto('${p.id}',this.files[0]);this.value=''"></label></div>` : ''}
    <div class="row" style="margin-top:14px">${p.status === 'active' && canWrite() ? `<button onclick="go('#pickup-edit/${p.id}')">แก้ไข</button>` : ''}${isAdmin() && p.status === 'active' ? `<button class="danger" onclick="cancelRow('food.pickup','${p.id}','รอบเข้ารับนี้')">ยกเลิกรอบ</button>` : ''}<a class="btn secondary" style="text-decoration:none" href="#pickups">กลับ</a></div></div>`;
}
async function cancelRow(table, id, label) {
  if (!confirm(`ยกเลิก${label}? ข้อมูลยังอยู่ในระบบแต่จะไม่นับรวม`)) return;
  try { await api.update(table, id, { status: 'inactive' }); toast('ยกเลิกแล้ว'); render(); } catch (e) { fail(e, 'ยกเลิกไม่สำเร็จ'); }
}

// =====================================================================
// ฟอร์มบันทึก/แก้ไขรอบ — 1 รอบ = 1 ฟาร์ม หลายแหล่ง (DEC-106 ข้อ 6)
// =====================================================================
async function pagePickupForm(view, id) {
  if (!canWrite()) return view.innerHTML = '<div class="card">เลือกองค์กรก่อน</div>';
  let p = null, items = [];
  if (id) { [p] = await api.list('food.pickup', { eq: { id } }); if (!p) return view.innerHTML = '<div class="card">ไม่พบรอบ</div>'; items = await api.list('food.pickup_item', { eq: { pickup_id: id, status: 'active' } }); }
  let lastFarm = ''; try { lastFarm = localStorage.getItem('food_last_farm') || ''; } catch {}
  const farms = S.farms.filter(f => f.status === 'active' || (p && f.id === p.farm_id));
  const srcs = S.sources.filter(s => s.status === 'active' || items.some(i => i.source_id === s.id));
  const itemOf = sid => items.find(i => i.source_id === sid) || {};
  S._newPhotos = [];
  view.innerHTML = `<div class="card"><h3 style="margin-top:0">${id ? 'แก้ไขรอบเข้ารับ' : 'บันทึกรอบเข้ารับ'} ${helpBtn('pickup-new')}</h3>
    <div class="grid2">
      <div><label>ฟาร์มที่เข้ารับ *</label><select id="f_farm">${farms.length ? '' : '<option value="">— ยังไม่มีฟาร์ม ให้ admin เพิ่มที่เมนูจัดการ —</option>'}${farms.map(f => `<option value="${f.id}" ${(p ? p.farm_id : lastFarm) === f.id ? 'selected' : ''}>${esc(f.name)}${f.status !== 'active' ? ' (ปิด)' : ''}</option>`).join('')}</select></div>
      <div><label>วันที่เข้ารับ *</label><input id="f_date" type="date" value="${p ? p.pickup_date : todayISO()}" max="${todayISO()}"></div>
      <div><label>เวลา (ไม่บังคับ)</label><input id="f_time" type="time" value="${p && p.pickup_time ? String(p.pickup_time).slice(0, 5) : ''}"></div>
      <div><label>รถที่ใช้ (ไม่บังคับ)</label><select id="f_vehicle"><option value="">—</option>${S.vehicles.filter(v => v.status === 'active' || (p && v.id === p.vehicle_id)).map(v => `<option value="${v.id}" ${p && p.vehicle_id === v.id ? 'selected' : ''}>${esc(v.name)}${v.plate_no ? ' ' + esc(v.plate_no) : ''}</option>`).join('')}</select></div>
      <div><label>ระยะทางรอบนี้ (กม. ไม่บังคับ)</label><input id="f_km" type="number" step="0.1" min="0" inputmode="decimal" value="${p && p.distance_km != null ? p.distance_km : ''}"></div>
    </div>
    <h4 style="margin:14px 0 4px">ปริมาณต่อแหล่ง <span class="muted">(กรอกเฉพาะแหล่งที่รับ · กก. ทศนิยมได้ · คะแนนคัดแยก 1 ต้องปรับปรุง … 5 ดีเยี่ยม)</span></h4>
    <div class="itemrow" style="border-bottom:2px solid var(--line)"><div class="muted">แหล่ง</div><div class="muted">กก.</div><div class="muted">คะแนน</div></div>
    ${srcs.map(s => { const it = itemOf(s.id); return `<div class="itemrow" data-sid="${s.id}"><div class="nm">${esc(s.name)}<div class="muted">${esc(typeOf(s.source_type_id).name || '')}</div></div><input class="kg" type="number" step="0.01" min="0" inputmode="decimal" placeholder="—" value="${it.weight_kg ?? ''}" aria-label="น้ำหนัก ${esc(s.name)}"><select class="q" aria-label="คะแนน ${esc(s.name)}"><option value="">—</option>${[1, 2, 3, 4, 5].map(q => `<option value="${q}" ${it.quality === q ? 'selected' : ''}>${q} ${QUALITY[q]}</option>`).join('')}</select></div>`; }).join('') || '<div class="muted">ยังไม่มีแหล่งเศษอาหาร ให้ admin เพิ่มที่เมนูจัดการ</div>'}
    <label>หมายเหตุ</label><textarea id="f_note" rows="2">${esc(p ? p.note || '' : '')}</textarea>
    ${id ? '' : `<h4 style="margin:14px 0 4px">รูป (สูงสุด ${maxPhotos()} ใบ · ย่อให้อัตโนมัติ)</h4><div class="row"><label class="btn secondary" style="margin:0;display:inline-flex;align-items:center">📷 ถ่ายรูป<input type="file" accept="image/*" capture="environment" class="hidden" onchange="pickPhotos(this.files);this.value=''"></label><label class="btn secondary" style="margin:0;display:inline-flex;align-items:center">🖼 เลือกจากคลัง<input type="file" accept="image/*" multiple class="hidden" onchange="pickPhotos(this.files);this.value=''"></label></div><div class="photos" id="f_photoList" style="margin-top:8px"><span class="muted">ยังไม่ได้เลือกรูป</span></div>`}
    <div class="row" style="margin-top:14px"><button id="f_save" style="min-width:160px">${id ? 'บันทึกการแก้ไข' : 'บันทึก'}</button><a class="btn secondary" style="text-decoration:none" href="${id ? '#pickup/' + id : '#home'}">ยกเลิก</a></div>
    <div class="muted" style="margin-top:6px">ไม่มีสัญญาณก็กดบันทึกได้ ระบบเก็บไว้ในเครื่องแล้วส่งให้เองเมื่อมีสัญญาณ</div></div>`;
  $('#f_save').onclick = () => savePickup(id, items);
}
function pickPhotos(files) {

async function savePickup(id, oldItems) {

// ส่งรอบ + รายการ + รูป (ใช้ทั้งตอนออนไลน์และตอนคิวส่งภายหลัง) · คืน id ของรอบ
async function submitPickup(payload) {
  const row = await api.insert('food.pickup', payload.pickup);
  await api.insertMany('food.pickup_item', payload.items.map(it => ({ ...it, pickup_id: row.id })));
  for (const ph of payload.photos || []) {
    try { await savePhoto(row.id, ph, payload.org_id); }
    catch (e) { if (isNetworkError(e)) { await Queue.push({ kind: 'photo', payload: { pickup_id: row.id, photo: ph, org_id: payload.org_id }, label: `รูปของรอบ ${payload.farm_name}` }); } else fail(e, 'ส่งรูปไม่สำเร็จ (บันทึกรอบแล้ว)'); }
  }
  return row.id;
}

Queue.handlers.photo = async payload => { await savePhoto(payload.pickup_id, payload.photo, payload.org_id); };
async function savePhoto(pickupId, ph, orgId) {
  const org = orgOf(orgId || S.scopeOrg || S.me.org_id);
  const endpoint = org.photo_endpoint_url || setting('default_photo_endpoint_url') || '';
  const existing = await api.list('food.pickup_photo', { eq: { pickup_id: pickupId, status: 'active' } });
  if (existing.length >= maxPhotos()) throw new Error(`รอบนี้มีรูปครบ ${maxPhotos()} รูปแล้ว`);
  const up = await api.uploadPhoto(endpoint, { ...ph, org_code: org.code, label: 'pickup', filename: `pickup_${Date.now()}.jpg` });
  return api.insert('food.pickup_photo', { pickup_id: pickupId, seq: existing.length + 1, storage_kind: 'gdrive', file_id: up.file_id, url: up.url, taken_at: new Date().toISOString() });
}
async function addPhoto(pickupId, file) {
  if (!file) return; toast('กำลังย่อและส่งรูป…');
  try { const ph = await compressImage(file); try { await savePhoto(pickupId, ph); toast('เพิ่มรูปแล้ว'); } catch (e) { if (!isNetworkError(e)) throw e; await Queue.push({ kind: 'photo', payload: { pickup_id: pickupId, photo: ph }, label: 'รูป (เพิ่มภายหลัง)' }); toast('ไม่มีสัญญาณ เก็บรูปไว้ส่งภายหลัง'); } render(); } catch (e) { fail(e); }
}

    <table><thead><tr><th>ชื่อล็อกอิน</th><th>ชื่อแสดง</th><th>บทบาท</th><th>สถานะ</th><th></th></tr></thead><tbody>${users.map(u => `<tr><td class="mono">${esc(u.username)}</td><td>${esc(u.display_name)}</td><td>${roleLabel(u.role)}</td><td>${u.status === 'active' ? '<span class="pill">ใช้งาน</span>' : '<span class="pill" style="background:#fee2e2">ปิด</span>'}</td><td style="white-space:nowrap">${(u.role === 'recorder' || isSuper()) && u.id !== S.me.id ? `<button class="small secondary" onclick="resetPw('${u.id}','${esc(u.username)}','${u.role}')">รีเซ็ตรหัส</button> <button class="small ${u.status === 'active' ? 'danger' : 'secondary'}" onclick="toggleUser('${u.id}','${u.status === 'active' ? 'inactive' : 'active'}')">${u.status === 'active' ? 'ปิด' : 'เปิด'}</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
}
async function toggleUser(id, status) { try { await api.update('core.app_user', id, { status }); toast(status === 'active' ? 'เปิดใช้งานแล้ว' : 'ปิดใช้งานแล้ว'); render(); } catch (e) { fail(e); } }
function orgSettings() {
  const o = orgOf(S.scopeOrg);
  return `<div class="card"><h4 style="margin-top:0">ตั้งค่าองค์กร: ${esc(o.name || '')}</h4>
    <label>ลิงก์ตัวรับรูปขององค์กร (ว่าง = ใช้ค่ากลางของเจ้าของโครงการ)</label><input id="o_ep" value="${esc(o.photo_endpoint_url || '')}" placeholder="https://script.google.com/macros/s/.../exec">
    <label>รหัสโฟลเดอร์ Drive ปลายทาง (ว่าง = ค่ากลาง)</label><input id="o_folder" value="${esc(o.photo_folder_id || '')}">
    <label>หมายเหตุ</label><textarea id="o_note" rows="2">${esc(o.note || '')}</textarea>
    <div class="row" style="margin-top:12px"><button onclick="saveOrgSettings()">บันทึก</button></div></div>`;
}
async function saveOrgSettings() { try { await api.update('core.org', S.scopeOrg, { photo_endpoint_url: $('#o_ep').value.trim() || null, photo_folder_id: $('#o_folder').value.trim() || null, note: $('#o_note').value.trim() || null }); toast('บันทึกแล้ว'); S.cache.coreLoaded = false; render(); } catch (e) { fail(e); } }

SPECS['core.org'] = { table: 'core.org', title: 'องค์กร', order: ['code'], intro: 'องค์กร = ผู้ใช้ระบบ 1 กลุ่ม (ศูนย์ เทศบาล หน่วยงาน) เห็นเฉพาะข้อมูลของตน · เพิ่มองค์กรแล้วไปที่ จัดการ → บัญชี เพื่อสร้าง admin',
  cols: [{ key: 'code', label: 'รหัส (A-Z 0-9 ใช้ประกอบชื่อล็อกอิน)', required: true, readonly: true }, { key: 'name', label: 'ชื่อ', required: true }, { key: 'max_recorders', label: 'เพดานผู้บันทึก', type: 'number', required: true }, { key: 'status', label: 'สถานะ', type: 'status' }],
  beforeSave: p => (p.code && !/^[A-Z0-9]{2,12}$/.test(p.code) ? 'รหัสองค์กรต้องเป็น A-Z/0-9 ยาว 2–12 ตัว' : null) };
SPECS['food.source_type'] = { table: 'food.source_type', title: 'ประเภทแหล่งเศษอาหาร', order: ['sort_order'], cols: [{ key: 'name', label: 'ชื่อประเภท', required: true }, { key: 'sort_order', label: 'ลำดับ', type: 'number' }, { key: 'status', label: 'สถานะ', type: 'status' }] };
const SETTINGS_META = { system_name: 'ชื่อระบบ', max_photos_per_pickup: 'รูปสูงสุดต่อรอบ', default_photo_endpoint_url: 'ลิงก์ตัวรับรูปค่ากลาง (URL ห้องเครื่อง)', default_photo_folder_id: 'โฟลเดอร์ Drive ค่ากลาง', quality_labels: 'ความหมายสเกลคุณภาพ' };
async function pageSuper(view) {
  const tab = location.hash.split('/')[1] || 'org';
  const tabs = [['org', 'องค์กร'], ['types', 'ประเภทแหล่ง'], ['settings', 'ตั้งค่าระบบ'], ['status', 'สถานะระบบ']];
  let body = '';
  if (tab === 'org') body = await crudSection(SPECS['core.org']);
  else if (tab === 'types') body = await crudSection(SPECS['food.source_type']);
  else if (tab === 'settings') body = `<div class="card"><h4 style="margin-top:0">ตั้งค่าระบบ</h4>${S.settings.map(s => `<label>${esc(SETTINGS_META[s.key] || s.key)} <span class="mono muted">${esc(s.key)}</span></label><div class="row"><input id="st_${esc(s.key)}" value="${esc(s.value || '')}" style="flex:1"><button class="small" onclick="saveSetting('${esc(s.key)}')">บันทึก</button></div>`).join('')}</div>`;
  else body = await superStatus();
  view.innerHTML = `<div class="subtabs">${tabs.map(([k, l]) => `<a href="#super/${k}" class="${tab === k ? 'active' : ''}">${l}</a>`).join('')}</div>${body}`;
}
async function saveSetting(key) { try { await api.update('core.app_setting', key, { value: $('#st_' + key).value.trim() }, 'key'); toast('บันทึกแล้ว'); S.cache.coreLoaded = false; render(); } catch (e) { fail(e); } }
async function superStatus() {
  const esriDays = Math.floor((new Date(CONFIG.ESRI_KEY_EXPIRES + 'T23:59:59+07:00') - Date.now()) / 86400000);
  let eng = 'ยังไม่ได้ตั้งค่า ENGINE_URL';
  if (CONFIG.ENGINE_URL) { try { const r = await api.engine('whoami', {}); eng = `ตอบปกติ · เห็นผู้เรียกเป็น ${r.me.username} · ฉบับ ${r.version || '-'}`; } catch (e) { eng = 'ตอบผิดพลาด: ' + friendlyError(e).title; } }
  const totals = await api.list('food.v_public_total');
  return `<div class="card"><h4 style="margin-top:0">สถานะระบบ</h4><table>
    <tr><th>ฐานข้อมูล</th><td>${IS_DEMO ? 'โหมดสาธิต' : esc(CONFIG.SUPABASE_URL)}</td></tr>
    <tr><th>ห้องเครื่อง</th><td>${esc(eng)}</td></tr>
    <tr><th>คีย์ Esri</th><td>หมดอายุ ${esc(CONFIG.ESRI_KEY_EXPIRES)} (${esriDays >= 0 ? 'เหลือ ' + esriDays + ' วัน' : 'หมดอายุแล้ว'})${esriDays < 30 ? ' <b style="color:var(--danger)">ต่ออายุที่ location.arcgis.com</b>' : ''}</td></tr>
    <tr><th>ยอดสาธารณะ</th><td>${totals.map(t => `${esc(t.org_code)}/${esc(t.project_code)}: ${fmt(t.total_kg)} กก. (${fmtInt(t.pickups)} รอบ)`).join('<br>') || '-'}</td></tr>
    <tr><th>ฉบับเว็บ</th><td>${esc(CREDIT.updated)}</td></tr></table></div>`;
}
