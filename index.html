<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UBRU AppTech System</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css?v=20261031a">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="common.js?v=20261031a"></script>
</head>
<body>
<header>
  <h1 id="title"><a href="./">UBRU AppTech System</a></h1>
  <a class="hbtn" href="food/">เข้าสู่ระบบ ›</a>
</header>
<main id="view"></main>
<footer class="credit" id="credit"></footer>
<div id="toastHost" role="status" aria-live="polite"></div>

<script>
// =====================================================================
// หน้าหลักของศูนย์ (สาธารณะ ไม่ต้องล็อกอิน) — แดชบอร์ดเผยแพร่จาก view v_public_* (ยอดรวมเท่านั้น)
//   #            ภาพรวมทุกโครงการที่เผยแพร่ + เมนูโมดูล
//   #p/<รหัสโครงการ>   หน้าแสดงผลของโครงการเดียว (เช่น #p/BPT68 สำหรับงานวิจัยปี 68) — DEC-106
// =====================================================================
const MODULES = [{ href: 'food/', name: 'บันทึกการเข้ารับเศษอาหาร', desc: 'สำหรับเจ้าหน้าที่และ admin · บันทึกรอบเข้ารับ แดชบอร์ด แผนที่' }];
window.addEventListener('hashchange', render);
async function render() {
  destroyCharts(); const view = $('#view');
  try {
    if (location.hash.startsWith('#about')) return pageAbout(view);
    const [totals, monthly, sources, farms] = await Promise.all([
      api.list('food.v_public_total', { order: ['project_code'] }), api.list('food.v_public_monthly', { order: ['month_start'] }),
      api.list('food.v_public_source', { order: ['total_kg', false] }), api.list('food.v_public_farm', { order: ['total_kg', false] })]);
    const code = location.hash.startsWith('#p/') ? decodeURIComponent(location.hash.slice(3)) : '';
    const pick = rows => code ? rows.filter(r => r.project_code === code) : rows;
    const T = pick(totals), M = pick(monthly), SRC = pick(sources), F = pick(farms);
    if (code && !T.length) return view.innerHTML = `<div class="card">ไม่พบโครงการ "${esc(code)}" หรือยังไม่เผยแพร่ <a href="#">กลับหน้าหลัก</a></div>`;
    const total = sum(T, 'total_kg'), pickups = sum(T, 'pickups');
    const first = T.map(t => t.first_date).filter(Boolean).sort()[0], last = T.map(t => t.last_date).filter(Boolean).sort().pop();
    // รวมรายเดือนข้ามโครงการ
    const mm = {}; for (const m of M) { const k = String(m.month_start).slice(0, 7); mm[k] = mm[k] || { k, kg: 0, n: 0 }; mm[k].kg += +m.total_kg; mm[k].n += +m.pickups; }
    const mArr = Object.values(mm).sort((a, b) => a.k.localeCompare(b.k));
    // รวมรายแหล่งกำเนิดเศษอาหารข้ามโครงการ (ชื่อเดียวกันรวมกัน)
    const ss = {}; for (const s of SRC) { const k = s.org_code + '|' + s.source_name; ss[k] = ss[k] || { name: s.source_name, type: s.source_type_name, kg: 0, n: 0, qsum: 0, qn: 0 }; ss[k].kg += +s.total_kg; ss[k].n += +s.pickups; if (s.avg_quality != null) { ss[k].qsum += +s.avg_quality * +s.pickups; ss[k].qn += +s.pickups; } }
    const sArr = Object.values(ss).sort((a, b) => b.kg - a.kg);
    const title = code ? `${esc(T[0].project_name)}` : 'ภาพรวมการเข้ารับเศษอาหาร';
    view.innerHTML = `
      ${code ? `<div class="muted" style="margin-bottom:6px"><a href="#">‹ หน้าหลัก</a> · โครงการ ${esc(code)}${T[0].year_be ? ' · ปี ' + T[0].year_be : ''}</div>` : `<div class="card" style="background:var(--brand);color:#fff;border-color:var(--brand)"><h2 style="margin:0 0 4px">ศูนย์การเรียนรู้และถ่ายทอดเทคโนโลยี BSF</h2><div style="color:#dbeafe">มหาวิทยาลัยราชภัฏอุบลราชธานี · ข้อมูลการเข้ารับเศษอาหารจากแหล่งกำเนิดเศษอาหารต่าง ๆ เพื่อนำไปใช้ประโยชน์ · อัปเดตอัตโนมัติจากการบันทึกของเจ้าหน้าที่</div></div>`}
      <h3 style="margin:8px 0">${title}</h3>
      <div class="kpis"><div class="kpi hero"><div class="l">เศษอาหารที่นำไปใช้ประโยชน์แล้ว</div><div class="v">${fmt(total)} กก.</div></div><div class="kpi"><div class="l">รอบเข้ารับ</div><div class="v">${fmtInt(pickups)}</div></div><div class="kpi"><div class="l">ฟาร์มที่รับ</div><div class="v">${fmtInt(sum(T, 'farms'))}</div></div><div class="kpi"><div class="l">แหล่งกำเนิดเศษอาหารที่ร่วม</div><div class="v">${fmtInt(sArr.length)}</div></div><div class="kpi"><div class="l">ช่วงข้อมูล</div><div class="v" style="font-size:16px">${first ? thDay(first) : '-'}<br>– ${last ? thDay(last) : '-'}</div></div></div>
      ${!code && T.length > 1 ? `<div class="card hbar-wrap"><div class="cardhead"><h4>แยกตามโครงการ</h4></div>${T.map((t, i) => hbar(`<a href="#p/${encodeURIComponent(t.project_code)}">${esc(t.project_name)}</a>`, +t.total_kg, Math.max(...T.map(x => +x.total_kg)), PALETTE[i % PALETTE.length], `${fmt(t.total_kg)} กก. · ${fmtInt(t.pickups)} รอบ`)).join('')}</div>` : ''}
      <div class="grid-dash">
        <div class="card"><div class="cardhead"><h4>ปริมาณรายเดือน (กก.)</h4></div><div class="chartbox"><canvas id="cMonth"></canvas></div></div>
        <div class="card"><div class="cardhead"><h4>แหล่งกำเนิดเศษอาหารที่ร่วมโครงการ</h4></div>${sArr.map((s, i) => hbar(esc(s.name), s.kg, sArr[0].kg, PALETTE[i % PALETTE.length], `${fmt(s.kg)} กก.`)).join('') || '<div class="muted">ยังไม่มีข้อมูล</div>'}</div>
        <div class="card"><div class="cardhead"><h4>ตารางรายแหล่งกำเนิดเศษอาหาร</h4></div><div class="tscroll"><table><thead><tr><th>แหล่งกำเนิด</th><th>ประเภท</th><th class="num">รอบ</th><th class="num">กก.</th><th class="num">คัดแยก/5</th></tr></thead><tbody>${sArr.map(s => `<tr><td>${esc(s.name)}</td><td>${esc(s.type || '')}</td><td class="num">${fmtInt(s.n)}</td><td class="num">${fmt(s.kg)}</td><td class="num">${s.qn ? fmt(s.qsum / s.qn) : '-'}</td></tr>`).join('')}</tbody></table></div><div class="muted" style="margin-top:6px">คะแนนคัดแยก 1 = ต้องปรับปรุง … 5 = ดีเยี่ยม (เฉลี่ยจากการประเมินของเจ้าหน้าที่แต่ละรอบ)</div></div>
        <div class="card"><div class="cardhead"><h4>ฟาร์มที่นำไปใช้ประโยชน์</h4></div><div class="tscroll"><table><thead><tr><th>ฟาร์ม</th><th class="nowrap">โครงการ</th><th class="num">รอบ</th><th class="num">กก.</th><th class="nowrap">ล่าสุด</th></tr></thead><tbody>${F.map(f => `<tr><td>${esc(f.farm_name)}</td><td class="nowrap">${esc(f.project_code)}</td><td class="num">${fmtInt(f.pickups)}</td><td class="num">${fmt(f.total_kg)}</td><td class="nowrap" data-sort-value="${f.last_date || ''}">${f.last_date ? thDay(f.last_date) : '-'}</td></tr>`).join('')}</tbody></table></div></div>
      </div>
      ${code ? '' : `<h3>ระบบงาน</h3><div class="grid2">${MODULES.map(m => `<a class="modcard" href="${m.href}"><b>${esc(m.name)}</b><div class="muted">${esc(m.desc)}</div></a>`).join('')}</div>`}
      <div id="carbonBox"></div>
      <div class="muted" style="margin-top:10px">ตัวเลขเป็นยอดรวมจากรายการที่เจ้าหน้าที่บันทึก (เฉพาะโครงการที่เผยแพร่) · คาร์บอนคำนวณสดจากค่าสัมประสิทธิ์ที่แสดงพร้อมแหล่งอ้างอิง · ฉบับ ${esc(CREDIT.updated)}</div>`;
    // DEC-113 คาร์บอน (สาธารณะ) — ถ้าฐานข้อมูลยังไม่มี view คาร์บอน ข้ามส่วนนี้ไปโดยไม่กระทบหน้าอื่น
    try {
      const [cRows, cFac] = await Promise.all([api.list('food.v_public_carbon', {}), api.list('food.v_public_carbon_factor', { order: ['sort_order'] })]);
      const C = pick(cRows).map(r => ({ ...r, _key: r.project_code + '|' + r.farm_name, _label: code ? r.farm_name : `${r.project_code} · ${r.farm_name}` }));
      if (C.length) $('#carbonBox').innerHTML = `<h3>การลดก๊าซเรือนกระจก</h3>` + carbonReport({ groups: C, factors: cFac, sources: sArr.map(s => ({ name: s.name, kg: s.kg })), groupTitle: code ? 'รายฟาร์ม' : 'รายโครงการและฟาร์ม', firstCol: code ? 'ฟาร์ม' : 'โครงการ · ฟาร์ม' });
    } catch (e) { console.warn('carbon section skipped:', e && e.message); }
    if (mArr.length) mkChart($('#cMonth'), { type: 'bar', data: { labels: mArr.map(m => thMonth(m.k + '-01')), datasets: [{ label: 'กก.', data: mArr.map(m => Math.round(m.kg * 100) / 100), backgroundColor: PALETTE[1] }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } } });
  } catch (e) { const f = friendlyError(e, 'โหลดข้อมูลไม่สำเร็จ'); console.error(e); view.innerHTML = `<div class="card"><b style="color:var(--danger)">${esc(f.title)}</b><div style="margin-top:6px">${esc(f.hint)}</div><div class="row" style="margin-top:10px"><button class="secondary" onclick="render()">ลองใหม่</button></div></div>`; }
  finally { setTimeout(() => makeSortable(view), 0); }
}
renderCredit(); render();
</script>
</body>
</html>
