.alert-decide { background:#eff6ff; color:#1e40af; }

.hhpick button.sel { background:#eff6ff; font-weight:600; }

.seg button { min-width:56px; }

.tchip { margin:0; padding:6px 10px; border:1px solid var(--line); border-radius:999px; background:#fff; min-height:40px; }

<body>
<header>
  <h1 id="title"><a href="../">UBRU AppTech</a> › กระบะเลี้ยง</h1>
  <span id="who" class="muted" style="color:#dbeafe;font-size:13px"></span>
  <button onclick="go('#me')">บัญชี</button>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="view"></main>
<footer class="credit" id="credit"></footer>
<div id="toastHost" role="status" aria-live="polite"></div>

<script>
// =====================================================================
// โมดูล 4: กระบะเลี้ยง (bsf) — DEC-118 · DEC-119
//   รุ่น = หนอนแรกฟักที่ลงกระบะอนุบาลวันเดียวกัน (วัน 0 = อายุหนอน 0) · อนุบาล 0–5 → แบ่งลงกระบะเลี้ยง/แจกครัวเรือน → เก็บเกี่ยว 15–20 วัน
//   แผน/ตารางการเลี้ยงคำนวณจากชีต "คำนวณอาหารและผลผลิต BSF.xlsx" (bsf-plan.js · ค่าใน bsf.param / bsf.plan_day)
//   ผู้บันทึก: ลงไข่ · ให้อาหาร · แบ่งกระบะ · แจก/ออกจากรุ่น · สุ่มชั่ง · เก็บเกี่ยว · ย้ายดักแด้เข้าโรงบิน · admin: + แก้/ยกเลิก · ค่าคำนวณ
// =====================================================================
const STAGE = { nursery: 'อนุบาล', grow: 'เลี้ยงต่อ', harvested: 'เก็บเกี่ยวแล้ว' };
const ALERT = { decide: 'ครบอนุบาล: แบ่งลงกระบะเลี้ยง/แจก', due: 'ถึงเวลาเก็บเกี่ยว', overdue: 'เลยกำหนดเก็บเกี่ยว' };
const ALERT_RANK = { overdue: 0, due: 1, decide: 2 };
const OUT_TYPES = { household: 'แจกครัวเรือน', broodstock: 'เก็บเป็นพ่อแม่พันธุ์', process: 'ส่งแปรรูป', sell: 'ขาย', dead: 'ตาย/ทิ้ง' };
const OUT_LABEL = { ...OUT_TYPES, pupa: 'ปล่อยเป็นดักแด้ (เดิม)' };
const FEED_STAGE = { nursery: 'อนุบาล', grow: 'เลี้ยงต่อ', any: 'ทุกระยะ' };
const BSF_SETTINGS = { bsf_nursery_days: 'อนุบาลกี่วัน', bsf_harvest_min_days: 'เก็บเกี่ยวได้ตั้งแต่อายุ (วัน)', bsf_harvest_max_days: 'ควรเก็บเกี่ยวไม่เกินอายุ (วัน)' };
const canWrite = () => S.me.role !== 'super_admin' || !!S.scopeOrg;
const projectsOfScope = () => S.projects.filter(x => (!S.scopeOrg || x.org_id === S.scopeOrg) && x.status === 'active');
const alertPill = a => a ? `<span class="pill alert-${a}">${ALERT[a]}</span>` : '';
const dayLabel = b => b.stage === 'harvested' ? `เก็บเกี่ยวเมื่ออายุ ${b.age_days} วัน` : `อายุ ${b.age_days} วัน · ${STAGE[b.stage]}`;
const ratioText = b => b.larvae_per_waste == null ? '-' : fmt(b.larvae_per_waste, 3) + (b.ratio_complete ? '' : ' *');
const feedTypeOf = id => (S.feedTypes || []).find(t => t.id === id) || {};
const nurseryDays = () => parseInt(setting('bsf_nursery_days')) || 5;
const range = (lo, hi, d = 2) => (lo == null || hi == null) ? '-' : (fmt(Math.min(lo, hi), d) === fmt(Math.max(lo, hi), d) ? fmt(lo, d) : `${fmt(Math.min(lo, hi), d)}–${fmt(Math.max(lo, hi), d)}`);
const ageOn = (b, date) => Math.round((new Date(date + 'T00:00:00') - new Date(b.lay_date + 'T00:00:00')) / 864e5);
const P = () => S.bsfP || bsfParams([]), PD = () => S.bsfD || bsfPlanDays(null);

const TABS = () => [['#home', 'รุ่นที่เลี้ยงอยู่'], ['#feed', 'ให้อาหาร'], ['#batches', 'ทุกรุ่น'], ['#plan', 'แผนการผลิต'], ['#summary', 'สรุปผล'], ...(isAdmin() ? [['#admin', 'จัดการ']] : []), ['#help', 'ช่วยเหลือ'], ['../food/', 'เศษอาหาร ›']];
function renderTabs() { $('#tabs').innerHTML = S.me ? TABS().map(([h, l]) => `<a href="${h}" class="${location.hash.startsWith(h) || (h === '#home' && !location.hash) ? 'active' : ''}">${l}</a>`).join('') : ''; }
window.addEventListener('hashchange', render);
async function render() {
  destroyCharts();
  const view = $('#view');
  try {
    if (!S.me) S.me = await api.me();
    if (location.hash.startsWith('#about')) { renderTabs(); return pageAbout(view); }
    if (!S.me) { renderTabs(); $('#who').textContent = ''; return pageLogin(view, '#home'); }
    await loadCore(); await loadBsf();
    $('#who').textContent = `${S.me.display_name} · ${roleLabel(S.me.role)}${S.me.org_id ? ' · ' + (orgOf(S.me.org_id).code || '') : ''}`;
    const h = location.hash || '#home'; renderTabs();
    if (h.startsWith('#batches')) return pageBatches(view);
    if (h.startsWith('#batch/')) return pageBatch(view, h.split('/')[1]);
    if (h.startsWith('#feed')) return pageFeed(view);
    if (h.startsWith('#plan')) return pagePlan(view);
    if (h.startsWith('#summary')) return pageSummary(view);
    if (h.startsWith('#admin')) return isAdmin() ? pageAdmin(view) : pageHome(view);
    if (h.startsWith('#me')) return pageMe(view);
    if (h.startsWith('#help')) return pageHelp(view);
    return pageHome(view);
  } catch (e) { const f = friendlyError(e, 'เปิดหน้านี้ไม่สำเร็จ'); console.error(e); if (f.kind === 'session' && S.me && api.name === 'supabase') return sessionLost();
    view.innerHTML = `<div class="card"><b style="color:var(--danger)">${esc(f.title)}</b>${f.hint ? `<div style="margin-top:6px">${esc(f.hint)}</div>` : ''}${f.raw && f.raw !== f.title ? `<div class="muted" style="margin-top:6px;word-break:break-all">${esc(f.raw)}</div>` : ''}<div class="row" style="margin-top:10px"><button class="secondary" onclick="render()">ลองใหม่</button><button class="secondary" onclick="S.cache={};location.reload()">รีเฟรชทั้งหน้า</button></div></div>`; }
  finally { setTimeout(() => { bindLabels(view); makeSortable(view); }, 0); }
}
async function loadBsf(force) {
  const key = 'bsf_' + S.scopeOrg;
  if (S.cache[key] && !force) { Object.assign(S, S.cache[key]); return; }
  const feedTypes = await api.list('bsf.feed_type', { eq: scopeEq(), order: ['sort_order'] });
  let params = [], planDays = [], cages = [], ingredients = [], prices = [], recipeItems = [], has017 = true;
  try {
    [params, planDays, cages, ingredients, prices, recipeItems] = await Promise.all([api.list('bsf.param', { eq: scopeEq(), order: ['sort_order'] }), api.list('bsf.plan_day', { eq: scopeEq(), order: ['age'] }), api.list('bsf.cage', { eq: scopeEq(), order: ['no'] }),
      api.list('bsf.ingredient', { eq: scopeEq(), order: ['sort_order'] }), api.list('bsf.ingredient_price', { eq: { ...scopeEq(), status: 'active' }, order: ['effective_from', false] }), api.list('bsf.recipe_item', { eq: scopeEq(), order: ['sort_order'] })]);
  } catch (e) { has017 = false; }   // ยังไม่ได้รัน 017 → ใช้ค่าจากชีตในโค้ด และปิดส่วนที่ต้องใช้ตารางใหม่
  S.cache[key] = { feedTypes, bsfParamRows: params, bsfPlanRows: planDays, cages, ingredients, prices, recipeItems, has017, bsfP: bsfParams(params), bsfD: bsfPlanDays(planDays) }; Object.assign(S, S.cache[key]);
}
const ingOf = id => (S.ingredients || []).find(i => i.id === id) || {};
const priceOn = (ingId, date) => { const p = (S.prices || []).filter(x => x.ingredient_id === ingId && x.effective_from <= date).sort((a, b) => b.effective_from.localeCompare(a.effective_from))[0]; return p ? Number(p.price_per_kg) : null; };
// แตกน้ำหนักอาหารเป็นวัตถุดิบตามอัตราส่วนของสูตร (ฐานข้อมูลทำแบบเดียวกันตอนบันทึก → bsf.feed_use)
function recipeSplit(recipeId, kg) { const items = (S.recipeItems || []).filter(i => i.recipe_id === recipeId), tot = items.reduce((s, i) => s + Number(i.parts), 0); return tot > 0 ? items.map(i => ({ ingredient_id: i.ingredient_id, name: ingOf(i.ingredient_id).name || '?', is_water: !!ingOf(i.ingredient_id).is_water, kg: kg * Number(i.parts) / tot })) : []; }
const recipeText = id => { const items = (S.recipeItems || []).filter(i => i.recipe_id === id); return items.length ? items.map(i => `${ingOf(i.ingredient_id).name || '?'} ${fmt(i.parts)}`).join(' : ') : 'ยังไม่มีส่วนผสม (admin ตั้งที่ จัดการ → ส่วนผสมสูตร)'; };
const costText = (cost, missing) => (cost == null && !Number(missing)) ? '-' : `${fmt(cost || 0)} บาท${Number(missing) ? ` <span class="muted">(ยังไม่มีราคา ${fmtInt(missing)} รายการ)</span>` : ''}`;
// เรียงรหัสกระบะตามตัวเลขทีละช่วง (1, 1.1, 1.2, 2 … 10) ไม่ใช่ตามตัวอักษร (1, 10, 2)
const seqCmp = (a, b) => { const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number); for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] ?? -1) - (y[i] ?? -1); if (d) return d; } return 0; };
const listTrays = async o => (await api.list('bsf.v_tray', o)).sort((p, q) => String(p.batch_id).localeCompare(String(q.batch_id)) || seqCmp(p.seq, q.seq));
const sortCodes = list => String(list || '').split(', ').filter(Boolean).sort((a, b) => seqCmp(a.split('-').pop(), b.split('-').pop())).join(', ');
const trayShort = (b, code) => String(code || '').startsWith(b.code + '-') ? String(code).slice(b.code.length + 1) : code;
async function listBatches(extra = {}) {
  const rows = await api.list('bsf.v_batch', { eq: { ...scopeEq(), ...(extra.eq || {}) }, order: ['lay_date', false], order2: ['code', false] });
  S._batchIdx = Object.fromEntries(rows.map(r => [r.id, r]));
  return rows;
}
async function batchById(id) { const r = (await api.list('bsf.v_batch', { eq: { id } }))[0]; if (!r) throw new Error('ไม่พบรุ่นนี้ (อาจถูกยกเลิก หรืออยู่นอกโครงการของบัญชี)'); (S._batchIdx = S._batchIdx || {})[id] = r; return r; }
const refresh = () => { S.cache = {}; render(); };
const need017 = () => S.has017 ? '' : '<div class="banner warn">ฐานข้อมูลยังไม่มีส่วนแผนการผลิต (sql/017) · ตัวเลขแผนใช้ค่าจากชีตในระบบ · ส่วนสุ่มชั่ง/พ่อแม่พันธุ์/โรงบินยังบันทึกไม่ได้</div>';

// ---- แผนของวันนี้ (การ์ดรุ่น) ----
const feedWeekdays = () => bsfParseWeekdays(setting('bsf_feed_weekdays'));
const DOW = ['', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.', 'อา.'];
const feedPlanText = (fp, n) => fp.plan ? `ตามแผน${fp.days > 1 ? ` ${fp.days} วัน (ถึง ${DOW[bsfIsoDow(fp.until)]} ${thDay(fp.until)})` : ' 1 วัน'} <b>${range(fp.plan.lo, fp.plan.hi)} กก./กระบะ</b>${n ? ` × ${fmtInt(n)} = ${range(fp.plan.lo * n, fp.plan.hi * n)} กก.` : ''}` : '';
function todayPlan(b) {
  if (b.stage === 'harvested') return '';
  const d = PD()[b.age_days], n = Math.max(b.trays_now, 0), fp = bsfFeedPlan(P(), PD(), b.lay_date, todayISO(), feedWeekdays(), nurseryDays());
  const parts = [fp.isMain ? '<b>วันให้หลัก</b>' : 'ไม่ใช่วันให้หลัก (ให้เพิ่มได้ถ้าอาหารหมด)'];
  if (fp.plan) parts.push(feedPlanText(fp, n)); else if (b.stage === 'nursery') parts.push('อนุบาล: สูตรอนุบาล กรอกตามจริง');
  if (b.last_feed_date) parts.push(`ให้ล่าสุด ${thDay(b.last_feed_date)}`);
  if (d && d.activity) parts.push(esc(d.activity));
  return `<div class="today-plan">วันนี้: ${parts.join(' · ')}</div>`;
}

// =====================================================================
// รุ่นที่เลี้ยงอยู่ (หน้าแรก)
// =====================================================================
async function pageHome(view) {
  const rows = (await listBatches({ eq: { status: 'active' } }));
  const live = rows.filter(b => b.stage !== 'harvested').sort((a, b) => (ALERT_RANK[a.alert] ?? 9) - (ALERT_RANK[b.alert] ?? 9) || a.lay_date.localeCompare(b.lay_date));
  const done = rows.filter(b => b.stage === 'harvested').slice(0, 5);
  const due = live.filter(b => b.alert === 'due' || b.alert === 'overdue').length;
  const feedToday = live.reduce((s, b) => { const fp = bsfFeedPlan(P(), PD(), b.lay_date, todayISO(), feedWeekdays(), nurseryDays()), n = Math.max(b.trays_now, 0); return fp.plan ? { lo: s.lo + fp.plan.lo * n, hi: s.hi + fp.plan.hi * n } : s; }, { lo: 0, hi: 0 });
  view.innerHTML = `${scopeSelector()}${need017()}
    <div class="kpis"><div class="kpi hero"><div class="l">รุ่นที่เลี้ยงอยู่</div><div class="v">${fmtInt(live.length)}</div></div>
      <div class="kpi"><div class="l">กระบะรวม</div><div class="v">${fmtInt(sum(live, 'trays_now'))}</div></div>
      <div class="kpi"><div class="l">อาหารตามแผนถ้าให้วันนี้ (กก.)</div><div class="v">${range(feedToday.lo, feedToday.hi, 1)}</div></div>
      <div class="kpi"><div class="l">ถึง/เลยเวลาเก็บเกี่ยว</div><div class="v" style="${due ? 'color:var(--warn)' : ''}">${fmtInt(due)}</div></div></div>
    <div class="cardhead" style="margin:4px 0 8px"><h4>รุ่นที่เลี้ยงอยู่ ${helpBtn('bsf-home')}</h4><a href="#batches">ทุกรุ่น ›</a></div>
    ${live.length ? live.map(batchCard).join('') : `<div class="card muted">ยังไม่มีรุ่นที่เลี้ยงอยู่ · กดปุ่ม "＋ ลงไข่รุ่นใหม่" เพื่อเริ่มรุ่นแรก</div>`}
    ${done.length ? `<div class="card"><div class="cardhead"><h4>เก็บเกี่ยวล่าสุด</h4><a href="#summary">สรุปผล ›</a></div><div class="tscroll"><table><thead><tr><th>รุ่น</th><th>เก็บเกี่ยว</th><th class="num">หนอน กก.</th><th class="num">มูล กก.</th><th class="num">หนอน/เศษอาหาร</th></tr></thead><tbody>${done.map(b => `<tr><td><a href="#batch/${b.id}" class="mono">${esc(b.code)}</a></td><td class="nowrap">${thDay(b.harvest_date)}</td><td class="num">${fmt(b.larvae_kg)}</td><td class="num">${fmt(b.frass_kg)}</td><td class="num">${ratioText(b)}</td></tr>`).join('')}</tbody></table></div></div>` : ''}
    ${canWrite() ? `<button class="fab" onclick="batchForm()">＋ ลงไข่รุ่นใหม่</button>` : ''}`;
}
function batchActs(b) {
  if (!canWrite() || b.status !== 'active') return '';
  const harvested = b.stage === 'harvested', grown = b.age_days >= nurseryDays(), t = S.has017;
  return `<div class="row acts">${!harvested ? `<button class="small" onclick="go('#feed/${todayISO()}/${b.id}')">ให้อาหาร</button>${t ? `<button class="small secondary" onclick="splitForm('${b.id}')">แบ่งกระบะ</button>` : ''}` : ''}${grown && t ? `<button class="small secondary" onclick="outForm('${b.id}','household')">แจกครัวเรือน</button>` : ''}${t ? `<button class="small secondary" onclick="outForm('${b.id}')">ออกจากรุ่นอื่น ๆ</button>` : ''}${!harvested && b.stage !== 'nursery' ? `<button class="small secondary" onclick="harvestForm('${b.id}')">เก็บเกี่ยว</button>` : ''}</div>`;
}
function batchCard(b) {
  return `<div class="card bcard"><div class="cardhead"><h4><a href="#batch/${b.id}" class="mono">${esc(b.code)}</a> <span class="pill">${esc(dayLabel(b))}</span></h4>${alertPill(b.alert)}</div>
    <div class="muted">${esc(b.project_code)} · ลงกระบะ ${thDay(b.lay_date)} · ไข่ ${fmt(b.egg_g)} ก. · กระบะ <b>${fmtInt(b.trays_now)}</b> · อาหาร ${fmt(b.feed_kg)} กก.${b.last_feed_date ? ` (ล่าสุด ${thDay(b.last_feed_date)})` : ' (ยังไม่ให้อาหาร)'}${Number(b.brood_trays) ? ` · พ่อแม่พันธุ์ ${fmtInt(b.brood_trays)} กระบะ` : ''}</div>
    ${todayPlan(b)}${batchActs(b)}</div>`;
}

// =====================================================================
// ทุกรุ่น
// =====================================================================
async function pageBatches(view) {
  const st = S._bt = S._bt || { project: '', stage: '', from: '', to: '' };
  const eq = isAdmin() ? {} : { status: 'active' };
  if (st.project) eq.project_id = st.project;
  let rows = await listBatches({ eq });
  if (st.stage) rows = rows.filter(b => b.stage === st.stage);
  if (st.from) rows = rows.filter(b => b.lay_date >= st.from); if (st.to) rows = rows.filter(b => b.lay_date <= st.to);
  S._btRows = rows;
  const cols = [{ label: 'รุ่น', key: 'code' }, { label: 'ลงกระบะ', key: 'lay_date' }, { label: 'อายุ (วัน)', key: 'age_days', cls: 'num' }, { label: 'ระยะ', key: 'stage' }, { label: 'กระบะ', key: 'trays_now', cls: 'num' }, { label: 'อาหาร กก.', key: 'feed_kg', cls: 'num' }, { label: 'แจก (ครัวเรือน)', key: 'hh_count', cls: 'num' }, { label: 'หนอน กก.', key: 'larvae_kg', cls: 'num' }, { label: 'หนอน/เศษอาหาร', key: 'larvae_per_waste', cls: 'num' }];

  const meas = rows.filter(b => Number(b.trays_reared) > Number(b.trays_start) && Number(b.egg_g) > 0).map(b => bsfSurvival(P(), PD(), Number(b.egg_g), Number(b.trays_reared))).filter(Boolean);
  const mAvg = meas.length ? { lo: meas.reduce((s, x) => s + x.lo, 0) / meas.length, hi: meas.reduce((s, x) => s + x.hi, 0) / meas.length } : null;
  const surv = st.surv === '' ? 1 : Math.min(Math.max(Number(st.surv) / 100, 0.01), 1);
  const t = bsfPerTray(P(), PD()), hmin = parseInt(setting('bsf_harvest_min_days')) || 15, hmax = parseInt(setting('bsf_harvest_max_days')) || 20, nur = nurseryDays();
  let out, eggs, nurTrays;
  if (st.mode === 'trays') { eggs = st.n * st.egg; nurTrays = st.n; const e = bsfFromEggs(P(), PD(), eggs, surv); out = { lo: { trays: e.lo.trays, feed: e.lo.feed, larvae_kg: e.lo.larvae_kg, frass_kg: e.lo.frass_kg }, hi: { trays: e.hi.trays, feed: e.hi.feed, larvae_kg: e.hi.larvae_kg, frass_kg: e.hi.frass_kg }, count: e.count }; }
  else { const g = bsfFromTarget(P(), PD(), st.kg, surv); out = { lo: { ...g.lo, larvae_kg: st.kg }, hi: { ...g.hi, larvae_kg: st.kg } }; eggs = Math.max(g.lo.egg_g, g.hi.egg_g); nurTrays = eggs / P().eggs_per_tray_g; }
  // ปฏิทิน: อาหารต่อวัน = หนอนทั้งหมด × k ÷ หน่วย (ไม่ขึ้นกับจำนวนกระบะ) · โหมดเป้าหนอนใช้กระบะแต่ละแบบ
  const days = Object.keys(PD()).map(Number), last = Math.max(hmax, ...days.filter(a => PD()[a].k != null));
  const cal = []; for (let a = 0; a <= last; a++) { const d = PD()[a] || {}; const acts = [d.activity || '']; if (a >= hmin && a <= hmax) acts.push(a === hmin ? 'เริ่มเก็บเกี่ยวได้' : a === hmax ? 'ควรเก็บเกี่ยวภายในวันนี้' : 'ช่วงเก็บเกี่ยว');
    const f = a >= nur && d.k != null ? { lo: out.lo.trays * t.lo.per_k * d.k, hi: out.hi.trays * t.hi.per_k * d.k } : null; cal.push({ a, date: bsfAddDays(st.start, a), act: acts.filter(Boolean).join(' · '), f }); }
  const sideRow = (label, k, d = 2) => `<tr><th>${label}</th><td class="num">${fmt(out.lo[k], d)}</td><td class="num">${fmt(out.hi[k], d)}</td></tr>`;
  view.innerHTML = `${scopeSelector()}${need017()}<div class="card"><div class="cardhead"><h4>แผนการผลิต ${helpBtn('bsf-plan')}</h4></div>
    <div class="seg"><button class="${st.mode === 'trays' ? '' : 'secondary'}" onclick="S._pl.mode='trays';render()">จากกระบะอนุบาล</button><button class="${st.mode === 'target' ? '' : 'secondary'}" onclick="S._pl.mode='target';render()">จากเป้าหนอน (กก.)</button></div>
    <div class="row" style="margin-top:10px">${st.mode === 'trays' ? `<label style="margin:0">กระบะอนุบาล <input type="number" min="1" step="1" inputmode="numeric" value="${st.n}" style="width:90px" onchange="S._pl.n=Math.max(1,parseInt(this.value)||1);render()"></label><label style="margin:0">ไข่ต่อกระบะ (ก.) <input type="number" min="0" step="any" inputmode="decimal" value="${st.egg}" style="width:90px" onchange="S._pl.egg=Math.max(0,Number(this.value)||0);render()"></label>` : `<label style="margin:0">เป้าหนอน (กก.) <input type="number" min="0" step="any" inputmode="decimal" value="${st.kg}" style="width:110px" onchange="S._pl.kg=Math.max(0,Number(this.value)||0);render()"></label>`}
      <label style="margin:0">วันลงกระบะ <input type="date" value="${st.start}" style="width:auto" onchange="S._pl.start=this.value||todayISO();render()"></label>
      <label style="margin:0">อัตรารอด (%) <input type="number" min="1" max="100" step="1" inputmode="numeric" value="${esc(st.surv)}" placeholder="100" style="width:80px" onchange="S._pl.surv=this.value;render()"></label></div>
    <div class="muted" style="margin-top:6px">${st.surv === '' ? 'ไม่ใส่อัตรารอด = ถือว่าฟักและรอดทั้งหมด (ค่าสูงสุดทางทฤษฎีตามชีต)' : `ใช้อัตรารอด ${fmt(surv * 100, 0)}%`}${mAvg ? ` · จากข้อมูลจริง ${meas.length} รุ่น (กระบะหลังแบ่ง) อัตรารอดเฉลี่ย ${range(mAvg.lo * 100, mAvg.hi * 100, 0)}% <button class="small secondary" onclick="S._pl.surv='${Math.round((mAvg.lo + mAvg.hi) * 50)}';render()">ใช้ค่ากลาง</button>` : ' · ยังไม่มีรุ่นที่แบ่งกระบะ ระบบจึงยังคำนวณอัตรารอดจริงไม่ได้'}</div>
    <div class="tscroll" style="margin-top:10px"><table><thead><tr><th></th><th class="num">แบบน้อย (${fmt(P().density_low)} ตัว/ตร.ซม.)</th><th class="num">แบบมาก (${fmt(P().density_high)} ตัว/ตร.ซม.)</th></tr></thead><tbody>
      <tr><th>ไข่</th><td class="num" colspan="2">${fmt(eggs, 2)} กรัม · กระบะอนุบาล ${fmt(nurTrays, 1)} ใบ (${fmt(P().eggs_per_tray_g)} ก./ใบ)</td></tr>
      ${sideRow('กระบะเลี้ยง (' + fmt(P().tray_w_cm) + '×' + fmt(P().tray_l_cm) + ' ซม.)', 'trays', 1)}${sideRow('อาหารทั้งรอบ (กก.)', 'feed', 1)}${sideRow('หนอนที่ได้ (กก.)', 'larvae_kg')}${sideRow('มูลที่ได้ (กก.)', 'frass_kg')}
    </tbody></table></div>
    <div class="muted" style="margin-top:6px">ต่อกระบะเลี้ยง 1 ใบ: หนอน ${fmtInt(t.lo.larvae)}–${fmtInt(t.hi.larvae)} ตัว · อาหาร ${range(t.lo.feed, t.hi.feed)} กก. · ได้หนอน ${range(t.lo.larvae_kg, t.hi.larvae_kg)} กก. · มูล ${range(t.lo.frass_kg, t.hi.frass_kg)} กก. · ที่มา: ชีตคำนวณอาหารและผลผลิต (แก้ค่าที่ จัดการ → ค่าคำนวณ)</div></div>
    <div class="card"><div class="cardhead"><h4>ปฏิทินการเลี้ยง</h4></div><div class="tscroll"><table><thead><tr><th>วันที่</th><th class="num">อายุ</th><th>กิจกรรม</th><th class="num">อาหาร/วัน (กก.)</th></tr></thead><tbody>
      ${cal.map(r => `<tr><td class="nowrap">${thDay(r.date)}</td><td class="num">${r.a}</td><td>${esc(r.act)}</td><td class="num">${r.f ? range(r.f.lo, r.f.hi, 1) : r.a < nur ? 'กรอกตามจริง' : '-'}</td></tr>`).join('')}
    </tbody></table></div></div>`;
}

  const comp = rows.filter(b => b.ratio_complete && Number(b.feed_waste_kg) > 0);
  const wasteC = sum(comp, 'feed_waste_kg'), larvC = sum(comp, 'larvae_kg'), t = bsfPerTray(P(), PD());
  const costed = rows.filter(b => b.feed_cost_per_kg_larvae != null), costAvg = costed.length ? sum(costed, 'feed_cost') / sum(costed, 'larvae_kg') : null;

      <div class="kpi"><div class="l">ต้นทุนอาหารต่อ กก. หนอน (${fmtInt(costed.length)} รุ่นที่มีราคาครบ)</div><div class="v">${costAvg != null ? fmt(costAvg) + ' บาท' : '-'}</div></div>
      <div class="kpi"><div class="l">หนอนรวม (5 มม. + 3 มม.)</div><div class="v">${fmt(sum(rows, 'larvae_kg'))} กก.</div></div>
      <div class="kpi"><div class="l">มูลรวม</div><div class="v">${fmt(sum(rows, 'frass_kg'))} กก.</div></div></div>
    <div class="muted" style="margin:6px 0 10px">อัตรา = หนอนที่เก็บเกี่ยว ÷ เศษอาหาร (วัตถุดิบเศษอาหารสด/หมักในสูตร) · ตามชีต หนอน ÷ อาหาร ${range(P().larvae_per_feed_high, P().larvae_per_feed_low, 3)} (คิดจากอาหารทุกชนิด เทียบได้คร่าว ๆ) · รุ่นที่มีการออกก่อนเก็บเกี่ยว (*) ไม่นำมาคิดอัตรารวม · ต้นทุน = วัตถุดิบ × ราคา ณ วันให้อาหาร</div>
    ${comp.length ? `<div class="card"><h4 style="margin-top:0">หนอน ÷ เศษอาหาร รายรุ่น (รุ่นสมบูรณ์)</h4><div style="position:relative;height:260px"><canvas id="chRatio" aria-label="กราฟอัตราแปลงรายรุ่น"></canvas></div></div>` : ''}
    <div class="card"><div class="cardhead"><h4>รุ่นที่เก็บเกี่ยวแล้ว (${fmtInt(rows.length)})</h4></div><div class="tscroll"><table data-sort="data"><thead><tr><th>รุ่น</th><th>เก็บเกี่ยว</th><th class="num">อายุ</th><th class="num">กระบะ</th><th class="num">เศษอาหาร กก.</th><th class="num">อาหารอื่น กก.</th><th class="num">หนอน กก.</th><th class="num">ประมาณการ กก.</th><th class="num">มูล กก.</th><th class="num">หนอน/เศษอาหาร</th><th class="num">ต้นทุน บาท/กก.</th></tr></thead><tbody>
    ${rows.map(b => { const r = Number(b.trays_reared ?? b.trays_start); return `<tr><td><a href="#batch/${b.id}" class="mono">${esc(b.code)}</a></td><td class="nowrap">${thDay(b.harvest_date)}</td><td class="num">${fmtInt(b.age_days)}</td><td class="num">${fmtInt(r)}</td><td class="num">${fmt(b.feed_waste_kg)}</td><td class="num">${fmt(b.feed_other_kg)}</td><td class="num">${fmt(b.larvae_kg)}</td><td class="num">${range(r * t.lo.larvae_kg, r * t.hi.larvae_kg)}</td><td class="num">${fmt(b.frass_kg)}</td><td class="num">${ratioText(b)}</td><td class="num">${b.feed_cost_per_kg_larvae != null ? fmt(b.feed_cost_per_kg_larvae) : '-'}</td></tr>`; }).join('') || '<tr><td colspan="11" class="muted">ยังไม่มีรุ่นที่เก็บเกี่ยว</td></tr>'}
    </tbody></table></div></div>`;

}

async function saveBsfSetting(key) {

}
