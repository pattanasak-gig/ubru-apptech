<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>กระบะเลี้ยงหนอน BSF</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common.css?v=20261101a">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../common.js?v=20261101a"></script>
<script src="../bsf-plan.js?v=20261101a"></script>
<style>
.bcard h4 a { text-decoration:none; font-size:20px; }
.bcard .acts, .acts { margin-top:8px; gap:6px; }
.acts button { min-height:44px; }
.alert-decide { background:#eff6ff; color:#1e40af; }
.alert-due { background:#fff7ed; color:#9a3412; }
.alert-overdue { background:#fee2e2; color:#991b1b; }
.code { font-size:26px; font-weight:700; letter-spacing:.5px; font-variant-numeric:tabular-nums; }
tr.off td { color:#94a3b8; text-decoration:line-through; }
tr.future td { color:#94a3b8; }
tr.today td { background:#f0fdf4; }
.chk { display:flex; align-items:center; gap:8px; margin-top:10px; }
.today-plan { margin-top:6px; padding:6px 10px; border-radius:8px; background:#f0fdf4; font-size:14px; }
.hhpick { max-height:260px; overflow:auto; border:1px solid var(--line); border-radius:10px; margin-top:6px; }
.hhpick button { display:block; width:100%; text-align:left; background:#fff; color:var(--ink); border:0; border-bottom:1px solid var(--line); border-radius:0; padding:10px 12px; min-height:44px; }
.hhpick button.sel { background:#eff6ff; font-weight:600; }
.seg { display:flex; gap:6px; flex-wrap:wrap; }
.seg button { min-width:56px; }
</style>
</head>
<body>
<header>
  <h1 id="title"><a href="../">UBRU AppTech</a> › กระบะเลี้ยง</h1>
  <span id="who" class="muted" style="color:#dbeafe;font-size:13px"></span>
  <button onclick="go('#me')">บัญชี</button>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="view"></main>
<footer class="credit" id="credit"></footer>
<div id="toastHost" role="status" aria-live="polite"></div>

<script>
// =====================================================================
// โมดูล 4: กระบะเลี้ยง (bsf) — DEC-118 · DEC-119
//   รุ่น = หนอนแรกฟักที่ลงกระบะอนุบาลวันเดียวกัน (วัน 0 = อายุหนอน 0) · อนุบาล 0–5 → แบ่งลงกระบะเลี้ยง/แจกครัวเรือน → เก็บเกี่ยว 15–20 วัน
//   แผน/ตารางการเลี้ยงคำนวณจากชีต "คำนวณอาหารและผลผลิต BSF.xlsx" (bsf-plan.js · ค่าใน bsf.param / bsf.plan_day)
//   ผู้บันทึก: ลงไข่ · ให้อาหาร · แบ่งกระบะ · แจก/ออกจากรุ่น · สุ่มชั่ง · เก็บเกี่ยว · ย้ายดักแด้เข้าโรงบิน · admin: + แก้/ยกเลิก · ค่าคำนวณ
// =====================================================================
const STAGE = { nursery: 'อนุบาล', grow: 'เลี้ยงต่อ', harvested: 'เก็บเกี่ยวแล้ว' };
const ALERT = { decide: 'ครบอนุบาล: แบ่งลงกระบะเลี้ยง/แจก', due: 'ถึงเวลาเก็บเกี่ยว', overdue: 'เลยกำหนดเก็บเกี่ยว' };
const ALERT_RANK = { overdue: 0, due: 1, decide: 2 };
const OUT_TYPES = { household: 'แจกครัวเรือน', broodstock: 'เก็บเป็นพ่อแม่พันธุ์', process: 'ส่งแปรรูป', sell: 'ขาย', dead: 'ตาย/ทิ้ง' };
const OUT_LABEL = { ...OUT_TYPES, pupa: 'ปล่อยเป็นดักแด้ (เดิม)' };
const FEED_STAGE = { nursery: 'อนุบาล', grow: 'เลี้ยงต่อ', any: 'ทุกระยะ' };
const BSF_SETTINGS = { bsf_nursery_days: 'อนุบาลกี่วัน', bsf_harvest_min_days: 'เก็บเกี่ยวได้ตั้งแต่อายุ (วัน)', bsf_harvest_max_days: 'ควรเก็บเกี่ยวไม่เกินอายุ (วัน)' };
const canWrite = () => S.me.role !== 'super_admin' || !!S.scopeOrg;
const projectsOfScope = () => S.projects.filter(x => (!S.scopeOrg || x.org_id === S.scopeOrg) && x.status === 'active');
const alertPill = a => a ? `<span class="pill alert-${a}">${ALERT[a]}</span>` : '';
const dayLabel = b => b.stage === 'harvested' ? `เก็บเกี่ยวเมื่ออายุ ${b.age_days} วัน` : `อายุ ${b.age_days} วัน · ${STAGE[b.stage]}`;
const ratioText = b => b.larvae_per_waste == null ? '-' : fmt(b.larvae_per_waste, 3) + (b.ratio_complete ? '' : ' *');
const feedTypeOf = id => (S.feedTypes || []).find(t => t.id === id) || {};
const nurseryDays = () => parseInt(setting('bsf_nursery_days')) || 5;
const range = (lo, hi, d = 2) => (lo == null || hi == null) ? '-' : (fmt(Math.min(lo, hi), d) === fmt(Math.max(lo, hi), d) ? fmt(lo, d) : `${fmt(Math.min(lo, hi), d)}–${fmt(Math.max(lo, hi), d)}`);
const ageOn = (b, date) => Math.round((new Date(date + 'T00:00:00') - new Date(b.lay_date + 'T00:00:00')) / 864e5);
const P = () => S.bsfP || bsfParams([]), PD = () => S.bsfD || bsfPlanDays(null);

const TABS = () => [['#home', 'รุ่นที่เลี้ยงอยู่'], ['#batches', 'ทุกรุ่น'], ['#plan', 'แผนการผลิต'], ['#summary', 'สรุปผล'], ...(isAdmin() ? [['#admin', 'จัดการ']] : []), ['#help', 'ช่วยเหลือ'], ['../food/', 'เศษอาหาร ›']];
function renderTabs() { $('#tabs').innerHTML = S.me ? TABS().map(([h, l]) => `<a href="${h}" class="${location.hash.startsWith(h) || (h === '#home' && !location.hash) ? 'active' : ''}">${l}</a>`).join('') : ''; }
window.addEventListener('hashchange', render);
async function render() {
  destroyCharts();
  const view = $('#view');
  try {
    if (!S.me) S.me = await api.me();
    if (location.hash.startsWith('#about')) { renderTabs(); return pageAbout(view); }
    if (!S.me) { renderTabs(); $('#who').textContent = ''; return pageLogin(view, '#home'); }
    await loadCore(); await loadBsf();
    $('#who').textContent = `${S.me.display_name} · ${roleLabel(S.me.role)}${S.me.org_id ? ' · ' + (orgOf(S.me.org_id).code || '') : ''}`;
    const h = location.hash || '#home'; renderTabs();
    if (h.startsWith('#batches')) return pageBatches(view);
    if (h.startsWith('#batch/')) return pageBatch(view, h.split('/')[1]);
    if (h.startsWith('#plan')) return pagePlan(view);
    if (h.startsWith('#summary')) return pageSummary(view);
    if (h.startsWith('#admin')) return isAdmin() ? pageAdmin(view) : pageHome(view);
    if (h.startsWith('#me')) return pageMe(view);
    if (h.startsWith('#help')) return pageHelp(view);
    return pageHome(view);
  } catch (e) { const f = friendlyError(e, 'เปิดหน้านี้ไม่สำเร็จ'); console.error(e); if (f.kind === 'session' && S.me && api.name === 'supabase') return sessionLost();
    view.innerHTML = `<div class="card"><b style="color:var(--danger)">${esc(f.title)}</b>${f.hint ? `<div style="margin-top:6px">${esc(f.hint)}</div>` : ''}${f.raw && f.raw !== f.title ? `<div class="muted" style="margin-top:6px;word-break:break-all">${esc(f.raw)}</div>` : ''}<div class="row" style="margin-top:10px"><button class="secondary" onclick="render()">ลองใหม่</button><button class="secondary" onclick="S.cache={};location.reload()">รีเฟรชทั้งหน้า</button></div></div>`; }
  finally { setTimeout(() => { bindLabels(view); makeSortable(view); }, 0); }
}
async function loadBsf(force) {
  const key = 'bsf_' + S.scopeOrg;
  if (S.cache[key] && !force) { Object.assign(S, S.cache[key]); return; }
  const feedTypes = await api.list('bsf.feed_type', { eq: scopeEq(), order: ['sort_order'] });
  let params = [], planDays = [], cages = [], has017 = true;
  try { [params, planDays, cages] = await Promise.all([api.list('bsf.param', { eq: scopeEq(), order: ['sort_order'] }), api.list('bsf.plan_day', { eq: scopeEq(), order: ['age'] }), api.list('bsf.cage', { eq: scopeEq(), order: ['no'] })]); }
  catch (e) { has017 = false; }   // ยังไม่ได้รัน 017 → ใช้ค่าจากชีตในโค้ด และปิดส่วนโรงบิน
  S.cache[key] = { feedTypes, bsfParamRows: params, bsfPlanRows: planDays, cages, has017, bsfP: bsfParams(params), bsfD: bsfPlanDays(planDays) }; Object.assign(S, S.cache[key]);
}
async function listBatches(extra = {}) {
  const rows = await api.list('bsf.v_batch', { eq: { ...scopeEq(), ...(extra.eq || {}) }, order: ['lay_date', false], order2: ['code', false] });
  S._batchIdx = Object.fromEntries(rows.map(r => [r.id, r]));
  return rows;
}
async function batchById(id) { const r = (await api.list('bsf.v_batch', { eq: { id } }))[0]; if (!r) throw new Error('ไม่พบรุ่นนี้ (อาจถูกยกเลิก หรืออยู่นอกโครงการของบัญชี)'); (S._batchIdx = S._batchIdx || {})[id] = r; return r; }
const refresh = () => { S.cache = {}; render(); };
const need017 = () => S.has017 ? '' : '<div class="banner warn">ฐานข้อมูลยังไม่มีส่วนแผนการผลิต (sql/017) · ตัวเลขแผนใช้ค่าจากชีตในระบบ · ส่วนสุ่มชั่ง/พ่อแม่พันธุ์/โรงบินยังบันทึกไม่ได้</div>';

// ---- แผนของวันนี้ (การ์ดรุ่น) ----
function todayPlan(b) {
  if (b.stage === 'harvested') return '';
  const d = PD()[b.age_days], plan = b.age_days >= nurseryDays() ? bsfFeedDay(P(), PD(), b.age_days, Math.max(b.trays_now, 0)) : null;
  const parts = []; if (plan) parts.push(`อาหารตามแผน <b>${range(plan.lo, plan.hi)} กก.</b> (${fmtInt(b.trays_now)} กระบะ)`); else if (b.stage === 'nursery') parts.push('อนุบาล: ให้รำหยาบ+อาหารไก่อ่อน กรอกตามจริง');
  if (d && d.activity) parts.push(esc(d.activity));
  return parts.length ? `<div class="today-plan">วันนี้: ${parts.join(' · ')}</div>` : '';
}

// =====================================================================
// รุ่นที่เลี้ยงอยู่ (หน้าแรก)
// =====================================================================
async function pageHome(view) {
  const rows = (await listBatches({ eq: { status: 'active' } }));
  const live = rows.filter(b => b.stage !== 'harvested').sort((a, b) => (ALERT_RANK[a.alert] ?? 9) - (ALERT_RANK[b.alert] ?? 9) || a.lay_date.localeCompare(b.lay_date));
  const done = rows.filter(b => b.stage === 'harvested').slice(0, 5);
  const due = live.filter(b => b.alert === 'due' || b.alert === 'overdue').length;
  const feedToday = live.reduce((s, b) => { const p = b.age_days >= nurseryDays() ? bsfFeedDay(P(), PD(), b.age_days, Math.max(b.trays_now, 0)) : null; return p ? { lo: s.lo + p.lo, hi: s.hi + p.hi } : s; }, { lo: 0, hi: 0 });
  view.innerHTML = `${scopeSelector()}${need017()}
    <div class="kpis"><div class="kpi hero"><div class="l">รุ่นที่เลี้ยงอยู่</div><div class="v">${fmtInt(live.length)}</div></div>
      <div class="kpi"><div class="l">กระบะรวม</div><div class="v">${fmtInt(sum(live, 'trays_now'))}</div></div>
      <div class="kpi"><div class="l">อาหารตามแผนวันนี้ (กก.)</div><div class="v">${range(feedToday.lo, feedToday.hi, 1)}</div></div>
      <div class="kpi"><div class="l">ถึง/เลยเวลาเก็บเกี่ยว</div><div class="v" style="${due ? 'color:var(--warn)' : ''}">${fmtInt(due)}</div></div></div>
    <div class="cardhead" style="margin:4px 0 8px"><h4>รุ่นที่เลี้ยงอยู่ ${helpBtn('bsf-home')}</h4><a href="#batches">ทุกรุ่น ›</a></div>
    ${live.length ? live.map(batchCard).join('') : `<div class="card muted">ยังไม่มีรุ่นที่เลี้ยงอยู่ · กดปุ่ม "＋ ลงไข่รุ่นใหม่" เพื่อเริ่มรุ่นแรก</div>`}
    ${done.length ? `<div class="card"><div class="cardhead"><h4>เก็บเกี่ยวล่าสุด</h4><a href="#summary">สรุปผล ›</a></div><div class="tscroll"><table><thead><tr><th>รุ่น</th><th>เก็บเกี่ยว</th><th class="num">หนอน กก.</th><th class="num">มูล กก.</th><th class="num">หนอน/เศษอาหาร</th></tr></thead><tbody>${done.map(b => `<tr><td><a href="#batch/${b.id}" class="mono">${esc(b.code)}</a></td><td class="nowrap">${thDay(b.harvest_date)}</td><td class="num">${fmt(b.larvae_kg)}</td><td class="num">${fmt(b.frass_kg)}</td><td class="num">${ratioText(b)}</td></tr>`).join('')}</tbody></table></div></div>` : ''}
    ${canWrite() ? `<button class="fab" onclick="batchForm()">＋ ลงไข่รุ่นใหม่</button>` : ''}`;
}
function batchActs(b) {
  if (!canWrite() || b.status !== 'active') return '';
  const harvested = b.stage === 'harvested', grown = b.age_days >= nurseryDays();
  return `<div class="row acts">${!harvested ? `<button class="small" onclick="feedForm('${b.id}')">ให้อาหาร</button><button class="small secondary" onclick="splitForm('${b.id}')">แบ่งกระบะ</button>` : ''}${grown ? `<button class="small secondary" onclick="outForm('${b.id}','household')">แจกครัวเรือน</button>` : ''}<button class="small secondary" onclick="outForm('${b.id}')">ออกจากรุ่นอื่น ๆ</button>${!harvested && b.stage !== 'nursery' ? `<button class="small secondary" onclick="harvestForm('${b.id}')">เก็บเกี่ยว</button>` : ''}</div>`;
}
function batchCard(b) {
  return `<div class="card bcard"><div class="cardhead"><h4><a href="#batch/${b.id}" class="mono">${esc(b.code)}</a> <span class="pill">${esc(dayLabel(b))}</span></h4>${alertPill(b.alert)}</div>
    <div class="muted">${esc(b.project_code)} · ลงกระบะ ${thDay(b.lay_date)} · ไข่ ${fmt(b.egg_g)} ก. · กระบะ <b>${fmtInt(b.trays_now)}</b> · อาหาร ${fmt(b.feed_kg)} กก.${b.last_feed_date ? ` (ล่าสุด ${thDay(b.last_feed_date)})` : ' (ยังไม่ให้อาหาร)'}${Number(b.brood_trays) ? ` · พ่อแม่พันธุ์ ${fmtInt(b.brood_trays)} กระบะ` : ''}</div>
    ${todayPlan(b)}${batchActs(b)}</div>`;
}

// =====================================================================
// ทุกรุ่น
// =====================================================================
async function pageBatches(view) {
  const st = S._bt = S._bt || { project: '', stage: '', from: '', to: '' };
  const eq = isAdmin() ? {} : { status: 'active' };
  if (st.project) eq.project_id = st.project;
  let rows = await listBatches({ eq });
  if (st.stage) rows = rows.filter(b => b.stage === st.stage);
  if (st.from) rows = rows.filter(b => b.lay_date >= st.from); if (st.to) rows = rows.filter(b => b.lay_date <= st.to);
  S._btRows = rows;
  const cols = [{ label: 'รุ่น', key: 'code' }, { label: 'ลงกระบะ', key: 'lay_date' }, { label: 'อายุ (วัน)', key: 'age_days', cls: 'num' }, { label: 'ระยะ', key: 'stage' }, { label: 'กระบะ', key: 'trays_now', cls: 'num' }, { label: 'อาหาร กก.', key: 'feed_kg', cls: 'num' }, { label: 'แจก (ครัวเรือน)', key: 'hh_count', cls: 'num' }, { label: 'หนอน กก.', key: 'larvae_kg', cls: 'num' }, { label: 'หนอน/เศษอาหาร', key: 'larvae_per_waste', cls: 'num' }];
  const row = b => `<tr class="${b.status !== 'active' ? 'off' : ''}"><td class="nowrap"><a href="#batch/${b.id}" class="mono">${esc(b.code)}</a><div class="muted">${esc(b.project_code)}</div></td><td class="nowrap">${thDay(b.lay_date)}</td><td class="num">${fmtInt(b.age_days)}</td><td>${esc(STAGE[b.stage])} ${alertPill(b.alert)}${b.status !== 'active' ? ' <span class="pill" style="background:#fee2e2">ยกเลิก</span>' : ''}</td><td class="num">${b.stage === 'harvested' ? '-' : fmtInt(b.trays_now)}</td><td class="num">${fmt(b.feed_kg)}</td><td class="num">${Number(b.hh_count) ? fmtInt(b.hh_count) : '-'}</td><td class="num">${b.stage === 'harvested' ? fmt(b.larvae_kg) : '-'}</td><td class="num">${ratioText(b)}</td></tr>`;
  view.innerHTML = `${scopeSelector()}<div class="card"><div class="cardhead"><h4>ทุกรุ่น (${fmtInt(rows.length)}) ${helpBtn('bsf-batches')}</h4><button class="small secondary" onclick="exportBatches()">ส่งออก CSV</button></div>
    <div class="row"><select style="width:auto;max-width:300px" aria-label="กรองโครงการวิจัย" onchange="S._bt.project=this.value;render()"><option value="">ทุกโครงการวิจัย</option>${projectsOfScope().map(x => `<option value="${x.id}" ${x.id === st.project ? 'selected' : ''}>${esc(x.code)}</option>`).join('')}</select>
      <select style="width:auto" aria-label="กรองระยะ" onchange="S._bt.stage=this.value;render()"><option value="">ทุกระยะ</option>${Object.entries(STAGE).map(([k, l]) => `<option value="${k}" ${k === st.stage ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <label style="margin:0">ลงกระบะตั้งแต่ <input type="date" value="${st.from}" onchange="S._bt.from=this.value;render()" style="width:auto"></label><label style="margin:0">ถึง <input type="date" value="${st.to}" onchange="S._bt.to=this.value;render()" style="width:auto"></label></div>
    <div class="muted" style="margin:6px 0">* = รุ่นที่มีการออกจากรุ่นก่อนเก็บเกี่ยว (แจกครัวเรือน/พ่อแม่พันธุ์) อัตราจึงต่ำกว่าความจริง ไม่นำไปรวมในสรุปผล</div>
    ${pagedTable('tblBatches', rows, cols, row, { empty: 'ยังไม่มีรุ่น', resetPage: true })}</div>
    ${canWrite() ? `<button class="fab" onclick="batchForm()">＋ ลงไข่รุ่นใหม่</button>` : ''}`;
}
function exportBatches() {
  const rows = S._btRows || []; if (!rows.length) return toast('ไม่มีข้อมูล', true);
  exportCsv(rows.map(b => ({ รหัสรุ่น: b.code, โครงการ: b.project_code, วันลงกระบะ: b.lay_date, ไข่_กรัม: b.egg_g, กระบะตั้งต้น: b.trays_start, กระบะหลังแบ่ง: b.trays_reared ?? '', กระบะตอนนี้: b.trays_now, อายุ_วัน: b.age_days, ระยะ: STAGE[b.stage], อาหารรวม_กก: b.feed_kg, เศษอาหาร_กก: b.feed_waste_kg, อาหารอื่น_กก: b.feed_other_kg, แจกครัวเรือน_ราย: b.hh_count ?? '', แจก_กระบะ: b.hh_trays ?? '', แจก_กก: b.hh_kg ?? '', พ่อแม่พันธุ์_กระบะ: b.brood_trays ?? '', เข้าโรงบิน_กก: b.caged_kg ?? '', ออกก่อนเก็บเกี่ยว_กระบะ: b.out_trays_before_harvest, วันเก็บเกี่ยว: b.harvest_date || '', หนอน5มม_กก: b.larvae_5mm_kg ?? '', หนอน3มม_กก: b.larvae_3mm_kg ?? '', มูล_กก: b.frass_kg ?? '', หนอนต่อเศษอาหาร: b.larvae_per_waste ?? '', อัตราสมบูรณ์: b.ratio_complete ? 'ใช่' : 'ไม่', สุ่มชั่ง_มก_ต่อตัว: b.sample_mg ?? '', สถานะ: b.status === 'active' ? 'ใช้งาน' : 'ยกเลิก', หมายเหตุ: b.note || '' })), 'กระบะเลี้ยง_' + todayISO());
}

// =====================================================================
// รายละเอียดรุ่น: ประมาณการ · ตารางการเลี้ยงรายวัน · ประวัติบันทึก
// =====================================================================
async function pageBatch(view, id) {
  const b = await batchById(id);

async function cancelEntry(table, id) {

  try { await api.update(table, id, { status: 'inactive' }); toast('ยกเลิกแล้ว'); refresh(); } catch (e) { fail(e, 'ยกเลิกไม่สำเร็จ'); }
}

async function hhLoad() {
  if (S._hh) return S._hh;
  try {
    const tabs = (await api.list('hh.tab', {})).filter(t => t.kind === 'master'); const tids = tabs.map(t => t.id);
    if (!tids.length) return (S._hh = []);
    const [cols, rows] = await Promise.all([api.list('hh.col', { in: { tab_id: tids } }), api.list('hh.row', { eq: { status: 'active' }, in: { tab_id: tids } })]);
    const hdr = (tid, role) => (cols.find(c => c.tab_id === tid && c.role === role) || {}).header;
    S._hh = rows.map(r => { const d = r.data || {}, v = role => { const h = hdr(r.tab_id, role); return h ? d[h] : null; }; return { code: r.hh_code, name: v('name') || '', tambon: v('tambon') || '', moo: v('moo') || '', project_id: r.project_id }; })
      .sort((a, b) => a.code.localeCompare(b.code, 'th', { numeric: true }));
  } catch (e) { S._hh = []; }
  return S._hh;
}
const hhName = code => ((S._hh || []).find(h => h.code === code) || {}).name || '';
function hhPickList(q, sel, projectId) {
  const k = String(q || '').trim().toLowerCase();
  const all = (S._hh || []).filter(h => !projectId || h.project_id === projectId);
  const rows = all.filter(h => !k || [h.code, h.name, h.tambon, h.moo && 'หมู่ ' + h.moo].join(' ').toLowerCase().includes(k)).slice(0, 60);
  return rows.map(h => `<button type="button" class="${h.code === sel ? 'sel' : ''}" onclick="hhChoose('${esc(h.code)}')"><b>${esc(h.code)}</b> ${esc(h.name)}<span class="muted"> ${h.moo ? 'หมู่ ' + esc(h.moo) + ' ' : ''}${h.tambon ? 'ต.' + esc(h.tambon) : ''}</span></button>`).join('') || `<div class="muted" style="padding:10px">ไม่พบครัวเรือนที่ค้นหา${all.length ? '' : ' (บัญชีนี้ไม่เห็นทะเบียนครัวเรือนของโครงการ พิมพ์รหัสเองในช่องค้นหาได้)'}</div>`;
}

async function pageSummary(view) {
  const st = S._sm = S._sm || { project: '' };
  const eq = { status: 'active' }; if (st.project) eq.project_id = st.project;
  const rows = (await listBatches({ eq })).filter(b => b.stage === 'harvested').sort((a, b) => a.harvest_date.localeCompare(b.harvest_date));
  const comp = rows.filter(b => b.ratio_complete && Number(b.feed_waste_kg) > 0);
  const wasteC = sum(comp, 'feed_waste_kg'), larvC = sum(comp, 'larvae_kg'), t = bsfPerTray(P(), PD());
  view.innerHTML = `${scopeSelector()}<div class="row" style="margin-bottom:8px"><select style="width:auto;max-width:300px" aria-label="กรองโครงการวิจัย" onchange="S._sm.project=this.value;render()"><option value="">ทุกโครงการวิจัย</option>${projectsOfScope().map(x => `<option value="${x.id}" ${x.id === st.project ? 'selected' : ''}>${esc(x.code)}</option>`).join('')}</select> ${helpBtn('bsf-summary')}</div>
    <div class="kpis"><div class="kpi hero"><div class="l">หนอน ÷ เศษอาหาร (รุ่นสมบูรณ์ ${fmtInt(comp.length)} รุ่น)</div><div class="v">${wasteC > 0 ? fmt(larvC / wasteC, 3) : '-'}</div></div>
      <div class="kpi"><div class="l">ตามชีต (หนอน ÷ อาหาร)</div><div class="v">${range(P().larvae_per_feed_high, P().larvae_per_feed_low, 3)}</div></div>
      <div class="kpi"><div class="l">หนอนรวม (5 มม. + 3 มม.)</div><div class="v">${fmt(sum(rows, 'larvae_kg'))} กก.</div></div>
      <div class="kpi"><div class="l">มูลรวม</div><div class="v">${fmt(sum(rows, 'frass_kg'))} กก.</div></div></div>
    <div class="muted" style="margin:6px 0 10px">อัตรา = หนอนที่เก็บเกี่ยว (กก.) ÷ เศษอาหารที่ให้ทั้งรุ่น (สด + หมัก กก.) · ไม่นับรำ/อาหารไก่ · รุ่นที่มีการออกก่อนเก็บเกี่ยว (*) ไม่นำมาคิดอัตรารวม · ค่าตามชีตคิดจากอาหารทุกชนิด จึงเทียบได้แบบคร่าว ๆ</div>
    ${comp.length ? `<div class="card"><h4 style="margin-top:0">หนอน ÷ เศษอาหาร รายรุ่น (รุ่นสมบูรณ์)</h4><div style="position:relative;height:260px"><canvas id="chRatio" aria-label="กราฟอัตราแปลงรายรุ่น"></canvas></div></div>` : ''}
    <div class="card"><div class="cardhead"><h4>รุ่นที่เก็บเกี่ยวแล้ว (${fmtInt(rows.length)})</h4></div><div class="tscroll"><table data-sort="data"><thead><tr><th>รุ่น</th><th>เก็บเกี่ยว</th><th class="num">อายุ</th><th class="num">ไข่ ก.</th><th class="num">กระบะเลี้ยง</th><th class="num">เศษอาหาร กก.</th><th class="num">อาหารอื่น กก.</th><th class="num">หนอน กก.</th><th class="num">ประมาณการ กก.</th><th class="num">มูล กก.</th><th class="num">หนอน/เศษอาหาร</th></tr></thead><tbody>
    ${rows.map(b => { const r = Number(b.trays_reared ?? b.trays_start); return `<tr><td><a href="#batch/${b.id}" class="mono">${esc(b.code)}</a></td><td class="nowrap">${thDay(b.harvest_date)}</td><td class="num">${fmtInt(b.age_days)}</td><td class="num">${fmt(b.egg_g)}</td><td class="num">${fmtInt(r)}</td><td class="num">${fmt(b.feed_waste_kg)}</td><td class="num">${fmt(b.feed_other_kg)}</td><td class="num">${fmt(b.larvae_kg)}</td><td class="num">${range(r * t.lo.larvae_kg, r * t.hi.larvae_kg)}</td><td class="num">${fmt(b.frass_kg)}</td><td class="num">${ratioText(b)}</td></tr>`; }).join('') || '<tr><td colspan="11" class="muted">ยังไม่มีรุ่นที่เก็บเกี่ยว</td></tr>'}
    </tbody></table></div></div>`;
  if (comp.length && window.Chart) mkChart($('#chRatio'), { type: 'bar', data: { labels: comp.map(b => b.code), datasets: [{ label: 'หนอน ÷ เศษอาหาร', data: comp.map(b => +Number(b.larvae_per_waste).toFixed(3)), backgroundColor: PALETTE[1] }] }, options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } } });
}

async function saveBsfSetting(key) {
  const v = $('#st_' + key).value.trim(); if (!/^[1-9][0-9]{0,2}$/.test(v)) return needField('#st_' + key, 'ใส่จำนวนวันเป็นจำนวนเต็ม 1–999');
  try { await api.update('core.app_setting', key, { value: v }, 'key'); toast('บันทึกแล้ว'); S.cache.coreLoaded = false; render(); } catch (e) { fail(e); }
}
