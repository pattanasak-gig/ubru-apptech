<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>กระบะเลี้ยงหนอน BSF</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common.css?v=20261031b">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../common.js?v=20261031b"></script>
<style>
.bcard h4 a { text-decoration:none; font-size:20px; }
.bcard .acts { margin-top:8px; gap:6px; }
.bcard .acts button { min-height:44px; }
.alert-decide { background:#eff6ff; color:#1e40af; }
.alert-due { background:#fff7ed; color:#9a3412; }
.alert-overdue { background:#fee2e2; color:#991b1b; }
.code { font-size:26px; font-weight:700; letter-spacing:.5px; font-variant-numeric:tabular-nums; }
tr.off td { color:#94a3b8; text-decoration:line-through; }
.chk { display:flex; align-items:center; gap:8px; margin-top:10px; }
</style>
</head>
<body>
<header>
  <h1 id="title"><a href="../">UBRU AppTech</a> › กระบะเลี้ยง</h1>
  <span id="who" class="muted" style="color:#dbeafe;font-size:13px"></span>
  <button onclick="go('#me')">บัญชี</button>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="view"></main>
<footer class="credit" id="credit"></footer>
<div id="toastHost" role="status" aria-live="polite"></div>

<script>
// =====================================================================
// โมดูล 4: กระบะเลี้ยง (bsf) — DEC-118
//   รุ่น = ไข่ที่ลงวันเดียวกัน 1 ชุด · อนุบาล → (ครบ 5 วัน) แจก/เลี้ยงต่อ → เก็บเกี่ยว (อายุ 15–20 วัน)
//   ผู้บันทึก: ลงไข่ · ให้อาหาร · แบ่งกระบะ · ออกจากรุ่น · เก็บเกี่ยว · admin: + แก้/ยกเลิก · ชนิดอาหาร
//   ต้องรัน sql/016_bsf_batch.sql และเปิดสคีมา bsf ใน Exposed schemas
// =====================================================================
const STAGE = { nursery: 'อนุบาล', grow: 'เลี้ยงต่อ', harvested: 'เก็บเกี่ยวแล้ว' };
const ALERT = { decide: 'ครบอนุบาล: ตัดสินใจแจก/เลี้ยงต่อ', due: 'ถึงเวลาเก็บเกี่ยว', overdue: 'เลยกำหนดเก็บเกี่ยว' };
const ALERT_RANK = { overdue: 0, due: 1, decide: 2 };
const OUT_TYPES = { household: 'แจกครัวเรือน', process: 'ส่งแปรรูป', sell: 'ขาย', pupa: 'ปล่อยเป็นดักแด้', dead: 'ตาย/ทิ้ง' };
const FEED_STAGE = { nursery: 'อนุบาล', grow: 'เลี้ยงต่อ', any: 'ทุกระยะ' };
const BSF_SETTINGS = { bsf_nursery_days: 'อนุบาลกี่วัน', bsf_harvest_min_days: 'เก็บเกี่ยวได้ตั้งแต่อายุ (วัน)', bsf_harvest_max_days: 'ควรเก็บเกี่ยวไม่เกินอายุ (วัน)' };
const canWrite = () => S.me.role !== 'super_admin' || !!S.scopeOrg;
const projectsOfScope = () => S.projects.filter(x => (!S.scopeOrg || x.org_id === S.scopeOrg) && x.status === 'active');
const alertPill = a => a ? `<span class="pill alert-${a}">${ALERT[a]}</span>` : '';
const dayLabel = b => b.stage === 'harvested' ? `เก็บเกี่ยวเมื่ออายุ ${b.age_days} วัน` : `วันที่ ${b.age_days} · ${STAGE[b.stage]}`;
const ratioText = b => b.larvae_per_waste == null ? '-' : fmt(b.larvae_per_waste, 3) + (b.ratio_complete ? '' : ' *');
const feedTypeOf = id => (S.feedTypes || []).find(t => t.id === id) || {};

const TABS = () => [['#home', 'รุ่นที่เลี้ยงอยู่'], ['#batches', 'ทุกรุ่น'], ['#summary', 'สรุปผล'], ...(isAdmin() ? [['#admin', 'จัดการ']] : []), ['#help', 'ช่วยเหลือ'], ['../food/', 'เศษอาหาร ›']];
function renderTabs() { $('#tabs').innerHTML = S.me ? TABS().map(([h, l]) => `<a href="${h}" class="${location.hash.startsWith(h) || (h === '#home' && !location.hash) ? 'active' : ''}">${l}</a>`).join('') : ''; }
window.addEventListener('hashchange', render);
async function render() {
  destroyCharts();
  const view = $('#view');
  try {
    if (!S.me) S.me = await api.me();
    if (location.hash.startsWith('#about')) { renderTabs(); return pageAbout(view); }
    if (!S.me) { renderTabs(); $('#who').textContent = ''; return pageLogin(view, '#home'); }
    await loadCore(); await loadBsf();
    $('#who').textContent = `${S.me.display_name} · ${roleLabel(S.me.role)}${S.me.org_id ? ' · ' + (orgOf(S.me.org_id).code || '') : ''}`;
    const h = location.hash || '#home'; renderTabs();
    if (h.startsWith('#batches')) return pageBatches(view);
    if (h.startsWith('#batch/')) return pageBatch(view, h.split('/')[1]);
    if (h.startsWith('#summary')) return pageSummary(view);
    if (h.startsWith('#admin')) return isAdmin() ? pageAdmin(view) : pageHome(view);
    if (h.startsWith('#me')) return pageMe(view);
    if (h.startsWith('#help')) return pageHelp(view);
    return pageHome(view);
  } catch (e) { const f = friendlyError(e, 'เปิดหน้านี้ไม่สำเร็จ'); console.error(e); if (f.kind === 'session' && S.me && api.name === 'supabase') return sessionLost();
    view.innerHTML = `<div class="card"><b style="color:var(--danger)">${esc(f.title)}</b>${f.hint ? `<div style="margin-top:6px">${esc(f.hint)}</div>` : ''}${f.raw && f.raw !== f.title ? `<div class="muted" style="margin-top:6px;word-break:break-all">${esc(f.raw)}</div>` : ''}<div class="row" style="margin-top:10px"><button class="secondary" onclick="render()">ลองใหม่</button><button class="secondary" onclick="S.cache={};location.reload()">รีเฟรชทั้งหน้า</button></div></div>`; }
  finally { setTimeout(() => { bindLabels(view); makeSortable(view); }, 0); }
}
async function loadBsf(force) {
  const key = 'bsf_' + S.scopeOrg;
  if (S.cache[key] && !force) { Object.assign(S, S.cache[key]); return; }
  const feedTypes = await api.list('bsf.feed_type', { eq: scopeEq(), order: ['sort_order'] });
  S.cache[key] = { feedTypes }; Object.assign(S, S.cache[key]);
}
async function listBatches(extra = {}) {
  const rows = await api.list('bsf.v_batch', { eq: { ...scopeEq(), ...(extra.eq || {}) }, order: ['lay_date', false], order2: ['code', false] });
  S._batchIdx = Object.fromEntries(rows.map(r => [r.id, r]));
  return rows;
}
async function batchById(id) { const r = (await api.list('bsf.v_batch', { eq: { id } }))[0]; if (!r) throw new Error('ไม่พบรุ่นนี้ (อาจถูกยกเลิก หรืออยู่นอกโครงการของบัญชี)'); (S._batchIdx = S._batchIdx || {})[id] = r; return r; }
const refresh = () => { S.cache = {}; render(); };

// =====================================================================
// รุ่นที่เลี้ยงอยู่ (หน้าแรก)
// =====================================================================
async function pageHome(view) {
  const rows = (await listBatches({ eq: { status: 'active' } }));
  const live = rows.filter(b => b.stage !== 'harvested').sort((a, b) => (ALERT_RANK[a.alert] ?? 9) - (ALERT_RANK[b.alert] ?? 9) || a.lay_date.localeCompare(b.lay_date));
  const done = rows.filter(b => b.stage === 'harvested').slice(0, 5);
  const due = live.filter(b => b.alert === 'due' || b.alert === 'overdue').length;
  view.innerHTML = `${scopeSelector()}
    <div class="kpis"><div class="kpi hero"><div class="l">รุ่นที่เลี้ยงอยู่</div><div class="v">${fmtInt(live.length)}</div></div>
      <div class="kpi"><div class="l">กระบะรวม</div><div class="v">${fmtInt(sum(live, 'trays_now'))}</div></div>
      <div class="kpi"><div class="l">ถึง/เลยเวลาเก็บเกี่ยว</div><div class="v" style="${due ? 'color:var(--warn)' : ''}">${fmtInt(due)}</div></div>
      <div class="kpi"><div class="l">อนุบาลอยู่</div><div class="v">${fmtInt(live.filter(b => b.stage === 'nursery').length)}</div></div></div>
    <div class="cardhead" style="margin:4px 0 8px"><h4>รุ่นที่เลี้ยงอยู่ ${helpBtn('bsf-home')}</h4><a href="#batches">ทุกรุ่น ›</a></div>
    ${live.length ? live.map(batchCard).join('') : `<div class="card muted">ยังไม่มีรุ่นที่เลี้ยงอยู่ · กดปุ่ม "＋ ลงไข่รุ่นใหม่" เพื่อเริ่มรุ่นแรก</div>`}
    ${done.length ? `<div class="card"><div class="cardhead"><h4>เก็บเกี่ยวล่าสุด</h4><a href="#summary">สรุปผล ›</a></div><div class="tscroll"><table><thead><tr><th>รุ่น</th><th>เก็บเกี่ยว</th><th class="num">หนอน กก.</th><th class="num">มูล กก.</th><th class="num">หนอน/เศษอาหาร</th></tr></thead><tbody>${done.map(b => `<tr><td><a href="#batch/${b.id}" class="mono">${esc(b.code)}</a></td><td class="nowrap">${thDay(b.harvest_date)}</td><td class="num">${fmt(b.larvae_kg)}</td><td class="num">${fmt(b.frass_kg)}</td><td class="num">${ratioText(b)}</td></tr>`).join('')}</tbody></table></div></div>` : ''}
    ${canWrite() ? `<button class="fab" onclick="batchForm()">＋ ลงไข่รุ่นใหม่</button>` : ''}`;
}
function batchCard(b) {
  const harvested = b.stage === 'harvested';
  return `<div class="card bcard"><div class="cardhead"><h4><a href="#batch/${b.id}" class="mono">${esc(b.code)}</a> <span class="pill">${esc(dayLabel(b))}</span></h4>${alertPill(b.alert)}</div>
    <div class="muted">${esc(b.project_code)} · ลงไข่ ${thDay(b.lay_date)} · ไข่ ${fmt(b.egg_g)} ก. · กระบะ <b>${fmtInt(b.trays_now)}</b> · อาหาร ${fmt(b.feed_kg)} กก.${b.last_feed_date ? ` (ล่าสุด ${thDay(b.last_feed_date)})` : ' (ยังไม่ให้อาหาร)'}</div>
    ${canWrite() && !harvested ? `<div class="row acts"><button class="small" onclick="feedForm('${b.id}')">ให้อาหาร</button><button class="small secondary" onclick="splitForm('${b.id}')">แบ่งกระบะ</button><button class="small secondary" onclick="outForm('${b.id}')">ออกจากรุ่น</button>${b.stage !== 'nursery' ? `<button class="small secondary" onclick="harvestForm('${b.id}')">เก็บเกี่ยว</button>` : ''}</div>` : ''}</div>`;
}

// =====================================================================
// ทุกรุ่น
// =====================================================================
async function pageBatches(view) {
  const st = S._bt = S._bt || { project: '', stage: '', from: '', to: '' };
  const eq = isAdmin() ? {} : { status: 'active' };
  if (st.project) eq.project_id = st.project;
  let rows = await listBatches({ eq });
  if (st.stage) rows = rows.filter(b => b.stage === st.stage);
  if (st.from) rows = rows.filter(b => b.lay_date >= st.from); if (st.to) rows = rows.filter(b => b.lay_date <= st.to);
  S._btRows = rows;
  const cols = [{ label: 'รุ่น', key: 'code' }, { label: 'ลงไข่', key: 'lay_date' }, { label: 'อายุ (วัน)', key: 'age_days', cls: 'num' }, { label: 'ระยะ', key: 'stage' }, { label: 'กระบะ', key: 'trays_now', cls: 'num' }, { label: 'อาหาร กก.', key: 'feed_kg', cls: 'num' }, { label: 'หนอน กก.', key: 'larvae_kg', cls: 'num' }, { label: 'หนอน/เศษอาหาร', key: 'larvae_per_waste', cls: 'num' }];
  const row = b => `<tr class="${b.status !== 'active' ? 'off' : ''}"><td class="nowrap"><a href="#batch/${b.id}" class="mono">${esc(b.code)}</a><div class="muted">${esc(b.project_code)}</div></td><td class="nowrap">${thDay(b.lay_date)}</td><td class="num">${fmtInt(b.age_days)}</td><td>${esc(STAGE[b.stage])} ${alertPill(b.alert)}${b.status !== 'active' ? ' <span class="pill" style="background:#fee2e2">ยกเลิก</span>' : ''}</td><td class="num">${b.stage === 'harvested' ? '-' : fmtInt(b.trays_now)}</td><td class="num">${fmt(b.feed_kg)}</td><td class="num">${b.stage === 'harvested' ? fmt(b.larvae_kg) : '-'}</td><td class="num">${ratioText(b)}</td></tr>`;
  view.innerHTML = `${scopeSelector()}<div class="card"><div class="cardhead"><h4>ทุกรุ่น (${fmtInt(rows.length)}) ${helpBtn('bsf-batches')}</h4><button class="small secondary" onclick="exportBatches()">ส่งออก CSV</button></div>
    <div class="row"><select style="width:auto;max-width:300px" aria-label="กรองโครงการวิจัย" onchange="S._bt.project=this.value;render()"><option value="">ทุกโครงการวิจัย</option>${projectsOfScope().map(x => `<option value="${x.id}" ${x.id === st.project ? 'selected' : ''}>${esc(x.code)}</option>`).join('')}</select>
      <select style="width:auto" aria-label="กรองระยะ" onchange="S._bt.stage=this.value;render()"><option value="">ทุกระยะ</option>${Object.entries(STAGE).map(([k, l]) => `<option value="${k}" ${k === st.stage ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <label style="margin:0">ลงไข่ตั้งแต่ <input type="date" value="${st.from}" onchange="S._bt.from=this.value;render()" style="width:auto"></label><label style="margin:0">ถึง <input type="date" value="${st.to}" onchange="S._bt.to=this.value;render()" style="width:auto"></label></div>
    <div class="muted" style="margin:6px 0">* = รุ่นที่มีการออกจากรุ่นก่อนเก็บเกี่ยว (เช่น แจกครัวเรือน) อัตราจึงต่ำกว่าความจริง ไม่นำไปรวมในสรุปผล</div>
    ${pagedTable('tblBatches', rows, cols, row, { empty: 'ยังไม่มีรุ่น', resetPage: true })}</div>
    ${canWrite() ? `<button class="fab" onclick="batchForm()">＋ ลงไข่รุ่นใหม่</button>` : ''}`;
}
function exportBatches() {
  const rows = S._btRows || []; if (!rows.length) return toast('ไม่มีข้อมูล', true);
  exportCsv(rows.map(b => ({ รหัสรุ่น: b.code, โครงการ: b.project_code, วันลงไข่: b.lay_date, ไข่_กรัม: b.egg_g, กระบะตั้งต้น: b.trays_start, กระบะตอนนี้: b.trays_now, อายุ_วัน: b.age_days, ระยะ: STAGE[b.stage], อาหารรวม_กก: b.feed_kg, เศษอาหาร_กก: b.feed_waste_kg, อาหารอื่น_กก: b.feed_other_kg, ออกก่อนเก็บเกี่ยว_กระบะ: b.out_trays_before_harvest, ออกก่อนเก็บเกี่ยว_กก: b.out_kg_before_harvest, วันเก็บเกี่ยว: b.harvest_date || '', หนอน5มม_กก: b.larvae_5mm_kg ?? '', หนอน3มม_กก: b.larvae_3mm_kg ?? '', มูล_กก: b.frass_kg ?? '', หนอนต่อเศษอาหาร: b.larvae_per_waste ?? '', อัตราสมบูรณ์: b.ratio_complete ? 'ใช่' : 'ไม่', สถานะ: b.status === 'active' ? 'ใช้งาน' : 'ยกเลิก', หมายเหตุ: b.note || '' })), 'กระบะเลี้ยง_' + todayISO());
}

// =====================================================================
// รายละเอียดรุ่น: สรุป + ไทม์ไลน์ (ให้อาหาร + เหตุการณ์)
// =====================================================================
async function pageBatch(view, id) {
  const b = await batchById(id);
  const [feeds, events] = await Promise.all([api.list('bsf.v_batch_feed', { eq: { batch_id: id }, order: ['feed_date'] }), api.list('bsf.v_batch_event', { eq: { batch_id: id }, order: ['event_date'] })]);
  const showOff = isAdmin();
  const tl = [...feeds.map(f => ({ ...f, _t: 'feed', _d: f.feed_date })), ...events.map(e => ({ ...e, _t: e.kind, _d: e.event_date }))]
    .filter(x => showOff || x.status === 'active').sort((a, c) => a._d.localeCompare(c._d) || String(a.created_at).localeCompare(String(c.created_at)));
  const what = x => x._t === 'feed' ? `ให้อาหาร: ${esc(x.feed_type_name)}${x.minced ? ' (บดสับ)' : ''}` : x._t === 'split' ? 'แบ่งกระบะ' : x._t === 'harvest' ? '<b>เก็บเกี่ยว</b>' : `ออกจากรุ่น: ${esc(OUT_TYPES[x.out_type] || x.out_type)}${x.hh_code ? ' ' + esc(x.hh_code) : ''}${x.after_harvest ? ' <span class="pill">หลังเก็บเกี่ยว</span>' : ''}`;
  const detail = x => x._t === 'feed' ? `${fmt(x.kg)} กก.` : x._t === 'split' ? `${x.trays_delta > 0 ? '+' : ''}${fmtInt(x.trays_delta)} กระบะ${x.kg != null ? ` · ชั่ง ${fmt(x.kg)} กก.` : ''}` : x._t === 'harvest' ? `หนอน 5 มม. ${fmt(x.larvae_5mm_kg)} · 3 มม. ${fmt(x.larvae_3mm_kg)} · มูล ${fmt(x.frass_kg)} กก.` : [x.trays ? fmtInt(x.trays) + ' กระบะ' : '', x.kg != null ? fmt(x.kg) + ' กก.' : ''].filter(Boolean).join(' · ');
  const byType = {}; feeds.filter(f => f.status === 'active').forEach(f => { byType[f.feed_type_name] = (byType[f.feed_type_name] || 0) + Number(f.kg); });
  const harvested = b.stage === 'harvested';
  view.innerHTML = `<div class="card"><div class="cardhead"><div><div class="code mono">${esc(b.code)}</div><div class="muted">${esc(b.project_code)} · ${esc(b.project_name || '')}</div></div><div>${alertPill(b.alert)}${b.status !== 'active' ? ' <span class="pill" style="background:#fee2e2">ยกเลิกแล้ว</span>' : ''}</div></div>
      <div class="kpis" style="margin-top:8px"><div class="kpi hero"><div class="l">${harvested ? 'เก็บเกี่ยวเมื่ออายุ' : 'อายุ · ' + STAGE[b.stage]}</div><div class="v">${fmtInt(b.age_days)} วัน</div></div>
        <div class="kpi"><div class="l">${harvested ? 'หนอนที่เก็บเกี่ยว' : 'กระบะตอนนี้'}</div><div class="v">${harvested ? fmt(b.larvae_kg) + ' กก.' : fmtInt(b.trays_now)}</div></div>
        <div class="kpi"><div class="l">อาหารรวม (เศษอาหาร)</div><div class="v">${fmt(b.feed_kg)} <span style="font-size:15px">(${fmt(b.feed_waste_kg)})</span> กก.</div></div>
        <div class="kpi"><div class="l">หนอน ÷ เศษอาหาร</div><div class="v">${ratioText(b)}</div></div></div>
      <div class="muted" style="margin-top:6px">ลงไข่ ${thDay(b.lay_date)} · ไข่ ${fmt(b.egg_g)} กรัม · กระบะตั้งต้น ${fmtInt(b.trays_start)} · บันทึกโดย ${esc(b.created_by_name || '-')}${b.note ? ' · ' + esc(b.note) : ''}</div>
      ${harvested ? `<div class="banner info" style="margin-top:8px">เก็บเกี่ยว ${thDay(b.harvest_date)}: หนอน 5 มม. ${fmt(b.larvae_5mm_kg)} · 3 มม. ${fmt(b.larvae_3mm_kg)} · มูล ${fmt(b.frass_kg)} กก. · ออกหลังเก็บเกี่ยว ${fmt(b.out_kg_after_harvest)} กก. · <b>คงเหลือ ${fmt(b.larvae_left_kg)} กก.</b></div>` : ''}
      ${!b.ratio_complete && harvested ? `<div class="banner warn">รุ่นนี้มีการออกจากรุ่นก่อนเก็บเกี่ยว ${fmtInt(b.out_trays_before_harvest)} กระบะ${Number(b.out_kg_before_harvest) ? ' / ' + fmt(b.out_kg_before_harvest) + ' กก.' : ''} อัตราจึงต่ำกว่าความจริง (*)</div>` : ''}
      ${canWrite() && b.status === 'active' ? `<div class="row acts" style="margin-top:8px">${!harvested ? `<button class="small" onclick="feedForm('${b.id}')">ให้อาหาร</button><button class="small secondary" onclick="splitForm('${b.id}')">แบ่งกระบะ</button>` : ''}<button class="small secondary" onclick="outForm('${b.id}')">ออกจากรุ่น</button>${!harvested && b.stage !== 'nursery' ? `<button class="small secondary" onclick="harvestForm('${b.id}')">เก็บเกี่ยว</button>` : ''}${isAdmin() ? `<button class="small secondary" onclick="batchEditForm('${b.id}')">แก้ข้อมูลรุ่น</button>` : ''}</div>` : ''}</div>

function installBsfDemo(d) {

  if (D['bsf.feed_type'].length) return;
  const iso = n => { const x = new Date(); x.setDate(x.getDate() - n); return new Date(x.getTime() - x.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
  const days = (a, b) => Math.round((new Date(a + 'T00:00:00') - new Date(b + 'T00:00:00')) / 86400000);
  const setv = (k, d0) => parseInt((D['core.app_setting'].find(s => s.key === k) || {}).value) || d0;
  [['bsf_nursery_days', '5'], ['bsf_harvest_min_days', '15'], ['bsf_harvest_max_days', '20']].forEach(([key, value]) => { if (!D['core.app_setting'].some(s => s.key === key)) add('core.app_setting', { key, value, description: BSF_SETTINGS[key] }); });
  for (const o of D['core.org']) [['รำหยาบ+อาหารไก่อ่อน (โปรตีน 20%)', 'nursery', false, false, 1], ['เศษอาหารสด', 'grow', true, true, 2], ['เศษอาหารหมัก', 'grow', true, true, 3], ['รำหยาบ+อาหารไก่ (โปรตีน 17%)', 'grow', false, false, 4]]
    .forEach(([name, stage, w, m, s]) => add('bsf.feed_type', { org_id: o.id, name, stage, is_food_waste: w, allow_minced: m, sort_order: s }));
  const nextCode = (org, dt) => { const p = String((Number(dt.slice(0, 4)) + 543) % 100).padStart(2, '0') + '-' + dt.slice(5, 7) + dt.slice(8, 10); const n = Math.max(0, ...D['bsf.batch'].filter(b => b.org_id === org && b.code.startsWith(p + '-')).map(b => +b.code.split('-')[2])) + 1; return p + '-' + String(n).padStart(2, '0'); };
  const harvestOf = bid => D['bsf.batch_event'].find(e => e.batch_id === bid && e.kind === 'harvest' && e.status === 'active');
  const traysOf = (bid, skip) => { const b = byId('bsf.batch', bid); return b.trays + D['bsf.batch_event'].filter(e => e.batch_id === bid && e.status === 'active' && e.id !== skip).reduce((s, e) => s + (e.kind === 'split' ? e.trays_delta : e.kind === 'out' && !e.after_harvest ? (e.trays || 0) : 0) * (e.kind === 'split' ? 1 : -1), 0); };
  const deny = me => { if (me.role === 'recorder') throw new Error('permission denied: row-level security (ผู้บันทึกแก้/ยกเลิกไม่ได้ ต้องให้ admin ทำ)'); };
  const childCheck = (bid, dt) => { const b = byId('bsf.batch', bid); if (!b.id) throw new Error('ไม่พบรุ่นที่เลือก'); if (b.status !== 'active') throw new Error('รุ่นนี้ถูกยกเลิกแล้ว บันทึกเพิ่มไม่ได้'); if (dt < b.lay_date) throw new Error('วันที่บันทึกอยู่ก่อนวันลงไข่ของรุ่น'); if (dt > todayISO()) throw new Error('วันที่เป็นวันในอนาคต ตรวจวันที่อีกครั้ง'); return b; };
  ext.beforeInsert['bsf.feed_type'] = (r, me) => { deny(me); r.org_id = r.org_id || me.org_id; };
  ext.beforeInsert['bsf.batch'] = (r, me) => {
    r.project_id = r.project_id || me.project_id; if (!r.project_id) throw new Error('ต้องเลือกโครงการของรุ่น');
    const pj = byId('core.project', r.project_id); r.org_id = pj.org_id;
    if (me.role === 'recorder' && me.project_id && me.project_id !== r.project_id) throw new Error('โครงการนี้อยู่นอกโครงการที่บัญชีของคุณสังกัด ให้ admin ตรวจสอบ');
    if (r.lay_date > todayISO()) throw new Error('วันลงไข่เป็นวันในอนาคต ตรวจวันที่อีกครั้ง');
    r.code = nextCode(r.org_id, r.lay_date);
  };
  ext.beforeInsert['bsf.batch_feed'] = r => { const b = childCheck(r.batch_id, r.feed_date); r.org_id = b.org_id; const t = byId('bsf.feed_type', r.feed_type_id); if (t.org_id !== b.org_id) throw new Error('ไม่พบชนิดอาหารที่เลือก'); if (r.minced && !t.allow_minced) throw new Error('ชนิดอาหารนี้ไม่มีตัวเลือกบดสับ'); };
  ext.beforeInsert['bsf.batch_event'] = r => {
    const b = childCheck(r.batch_id, r.event_date); r.org_id = b.org_id; const h = harvestOf(b.id);
    if (r.kind === 'harvest' && h) throw new Error('รุ่นนี้บันทึกการเก็บเกี่ยวแล้ว (1 รุ่น เก็บเกี่ยวได้ครั้งเดียว)');
    if (r.kind === 'split' && h) throw new Error('รุ่นนี้เก็บเกี่ยวแล้ว แบ่งกระบะไม่ได้');
    if (r.kind === 'split' && traysOf(b.id) + r.trays_delta < 0) throw new Error('จำนวนกระบะคงเหลือติดลบ ตรวจจำนวนกระบะอีกครั้ง');
    if (r.kind === 'out') { r.after_harvest = !!h; if (!h && r.trays && traysOf(b.id) - r.trays < 0) throw new Error('จำนวนกระบะคงเหลือติดลบ ตรวจจำนวนกระบะอีกครั้ง');
      if (r.out_type === 'household') { const links = D['hh.link'].filter(l => l.project_id === b.project_id && l.status === 'active'); if (links.length && !D['hh.row'].some(x => x.project_id === b.project_id && x.hh_code === String(r.hh_code).trim() && x.status === 'active')) throw new Error('ไม่พบรหัสครัวเรือน ' + r.hh_code + ' ในทะเบียนครัวเรือนของโครงการนี้'); r.hh_code = String(r.hh_code).trim(); } else r.hh_code = null; }
  };
  for (const t of ['bsf.feed_type', 'bsf.batch_feed', 'bsf.batch_event']) ext.beforeUpdate[t] = (r, p, me) => deny(me);
  ext.beforeUpdate['bsf.batch'] = (r, p, me) => { deny(me); if (p.code && p.code !== r.code) throw new Error('เปลี่ยนรหัสรุ่นไม่ได้'); };
  ext.scope.bsf = (name, rows, me) => {
    if (me.role === 'super_admin') return rows;
    if (name === 'bsf.feed_type') return rows.filter(r => r.org_id === me.org_id);
    const okB = b => b.org_id === me.org_id && (me.role !== 'recorder' || !me.project_id || b.project_id === me.project_id);
    if (name === 'bsf.batch' || name === 'bsf.v_batch') return rows.filter(okB);
    const vis = new Set(D['bsf.batch'].filter(okB).map(b => b.id)); return rows.filter(r => vis.has(r.batch_id));
  };
  views['bsf.v_batch'] = () => { const today = todayISO(), nur = setv('bsf_nursery_days', 5), hmin = setv('bsf_harvest_min_days', 15), hmax = setv('bsf_harvest_max_days', 20);
    return D['bsf.batch'].map(b => {
      const pj = byId('core.project', b.project_id), fs = D['bsf.batch_feed'].filter(f => f.batch_id === b.id && f.status === 'active'), es = D['bsf.batch_event'].filter(e => e.batch_id === b.id && e.status === 'active');
      const h = es.find(e => e.kind === 'harvest'), age = days(h ? h.event_date : today, b.lay_date), outsB = es.filter(e => e.kind === 'out' && !e.after_harvest);
      const waste = fs.filter(f => byId('bsf.feed_type', f.feed_type_id).is_food_waste).reduce((s, f) => s + +f.kg, 0), feedKg = fs.reduce((s, f) => s + +f.kg, 0);
      const split = es.filter(e => e.kind === 'split').reduce((s, e) => s + e.trays_delta, 0), larv = h ? (+h.larvae_5mm_kg || 0) + (+h.larvae_3mm_kg || 0) : 0, outA = es.filter(e => e.kind === 'out' && e.after_harvest).reduce((s, e) => s + (+e.kg || 0), 0);
      const stage = h ? 'harvested' : age < nur ? 'nursery' : 'grow';
      const alert = h ? null : age > hmax ? 'overdue' : age >= hmin ? 'due' : (age >= nur && age <= nur + 1 && !outsB.length && !split) ? 'decide' : null;
      return { ...b, project_code: pj.code, project_name: pj.name, trays_start: b.trays, created_by_name: byId('core.app_user', b.created_by).display_name, age_days: age, stage, alert, trays_now: b.trays + split - outsB.reduce((s, e) => s + (e.trays || 0), 0),
        feeds: fs.length, feed_kg: feedKg, feed_waste_kg: waste, feed_other_kg: feedKg - waste, last_feed_date: fs.map(f => f.feed_date).sort().pop() || null, outs_before_harvest: outsB.length, out_trays_before_harvest: outsB.reduce((s, e) => s + (e.trays || 0), 0), out_kg_before_harvest: outsB.reduce((s, e) => s + (+e.kg || 0), 0),
